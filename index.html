   不动「标题→首行」那一段，保证四个入口页该间距完全相等 */
#view-contact .contact-grid{ margin-top:46px; }
.contact-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
.contact-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-xl);
  padding:34px 26px; box-shadow:var(--sh); text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  transition:.34s cubic-bezier(.22,.8,.3,1);
}
.contact-card:hover{ transform:translateY(-5px); box-shadow:var(--sh-h); }
.contact-ico{
  width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--sky),var(--blue)); box-shadow:0 8px 20px rgba(27,132,240,.26);
}
.contact-card:nth-child(2) .contact-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); box-shadow:0 8px 20px rgba(255,154,61,.28); }
.contact-card:nth-child(3) .contact-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); box-shadow:0 8px 20px rgba(255,124,182,.3); }
.contact-ico svg{ width:23px;height:23px; }
.contact-card i{ font-style:normal; font-size:11px; font-weight:800; color:var(--ink-3); letter-spacing:.6px; }
.contact-card b{ font-size:15px; font-weight:900; word-break:break-all; }

.footnote{
  text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-3);
  padding:40px 0 10px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.footnote svg{ width:13px;height:13px; }

/* ============================================================
   9. 响应式
   ============================================================ */
@media (max-width:960px){
  /* 窄屏：解除首屏等高铁律与固定卡高，改为自然流式 */
  .hero{ padding:34px 0 20px; grid-template-columns:1fr; gap:28px; min-height:0; }
  .hero-visual{ order:-1; }
  .hero-entries{ margin-top:26px; padding-top:0; flex:0 0 auto; grid-auto-rows:auto; }
  .avatar-wrap{ max-width:280px; flex:0 0 auto; }
  .avatar-card{ aspect-ratio:1/1.05; min-height:0; }
  .avatar-stage{ flex:1; min-height:0; }
  .node-grid{ grid-template-columns:1fr; grid-auto-rows:auto; }
  .node-grid.g1 > .card{ grid-column:auto; }
  .proj-grid{ grid-auto-rows:auto; }
  .proj-card{ grid-template-columns:1fr; gap:26px; padding:18px var(--card-padding); }
  .proj-info{ height:auto; gap:18px; }
  .skill-grid{ grid-template-columns:1fr; }
  .contact-grid{ grid-template-columns:1fr; }
  .dual,.dual.ai{ grid-template-columns:1fr; }
  .gate-row{ grid-template-columns:1fr; }
  .ai-app{ grid-template-columns:1fr; }
  .ai-strip{ grid-template-columns:1fr; }
  .path-row{ grid-template-columns:1fr; }
  .cap-matrix{ grid-template-columns:1fr 1fr; }
  .flip-grid.g3{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stack-panel{ transform:none; animation:none; }
  .card{ min-height:auto; }
  .skill-card{ min-height:220px; }
  .tl{ padding-left:26px; }
  .tl-node::before{ left:-26px; top:6px; width:18px;height:18px; }
}
@media (max-width:600px){
  main{ padding:0 16px 60px; }
  .topbar-in{ padding:10px 14px; gap:10px; }
  .brand-sub{ display:none; }
  .hero-entries{ grid-template-columns:1fr; }
  .hero-name{ letter-spacing:-1px; }
  .view-title{ font-size:24px; }
  .social-grid{ grid-template-columns:1fr; }
  .gantt-stages{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .tech-row.g3{ grid-template-columns:repeat(2,max-content); }
  .skill-main{ gap:16px; }
  .skill-card{ padding:22px; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.15s !important; }
  [data-anim]{ opacity:1; transform:none; }
}

<!-- ====== SVG 图标库 ====== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gWb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA23D"/><stop offset="100%" stop-color="#FF4D4D"/>
    </linearGradient>

    <!-- ===== 【需求6】首屏人像 3D 视频的「去残留 + 提亮」滤镜 =====
         被 .avatar-video 的 filter:url(#heroExp) 引用（见上面的 --video-filter）。
         实测原始素材的三大问题（用 canvas 抽帧 + 逐像素统计得出，不是猜的）：
           · 底色不是白，而是一层「淡粉网格纸」：R/G ≈ 0.855~0.91，B ≈ 0.82~0.88
             → 蓝通道天生偏低 0.03~0.08，正片叠底后残留一层浅黄/浅粉方格 = 「抠图残留」
           · 主体（3D 女孩）暗部 p01 只有 0.019（死黑糊成一团），p50 = 0.65
           · 背景边角亮度只有 0.85~0.88，直接叠底会留下一个比页面暗 10% 的「灰方框」
         三步管线（顺序很关键：白平衡必须放最后，才能保证背景一定被夹到纯白）：
           ① 色调曲线 type="table"（21 个采样点 → 20 段，每段 0.05 宽）
              · f(0) = 0.05 → 黑点抬起，暗部不再死黑（主体 p01 由 0.019 提到 ≈0.075）
              · 中段斜率 ≈ 0.99 → 中间调基本原样传递，不发灰
              · f(0.88) 起迅速收敛到 1.0 → 只把「背景那一档浅灰」推到纯白，
                人物（p99 ≈ 0.80）几乎不受影响 → 这就是「提高暗部 + 降低对比度」那两条的实现
           ② 降饱和 saturate 0.85
              → 压掉背景网格的粉调，以及人物剪影边缘的彩色描边（彩边残留的主要来源）
           ③ 逐通道 linear 白平衡（必须最后一步！）
              R 1.06 / G 1.05 / B 1.12 → 三层通道各自推到 1.0：
              背景最暗的 1% 像素实测三通道全部 = 1.000，背景偏差 p99 由 0.363 降到 ≈0.01
              （对比 Phase D 的 slope 1.15 + gamma 2.2：背景偏差 p99 = 0.363、边缘闪烁残留 0.65）
         ★ 想更暗 / 更亮：整体缩放第 ① 步的 tableValues（务必让最后一个值保持 1）
         ★ 背景又开始露边：优先加第 ③ 步 B 通道的 slope（蓝通道最容易先不够）
         ★ color-interpolation-filters="sRGB" 必须保留 —— 否则浏览器按 linearRGB 计算，效果完全不同 -->
    <filter id="heroExp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- ① 提黑 + 高光收敛：21 个采样点 = 0,0.05,0.10,…,1.0 -->
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.05 0.105 0.16 0.212 0.265 0.318 0.368 0.418 0.468 0.517 0.565 0.616 0.667 0.70 0.755 0.82 0.89 0.965 1 1 1"/>
        <feFuncG type="table" tableValues="0.05 0.105 0.16 0.212 0.265 0.318 0.368 0.418 0.468 0.517 0.565 0.616 0.667 0.70 0.755 0.82 0.89 0.965 1 1 1"/>
        <feFuncB type="table" tableValues="0.05 0.105 0.16 0.212 0.265 0.318 0.368 0.418 0.468 0.517 0.565 0.616 0.667 0.70 0.755 0.82 0.89 0.965 1 1 1"/>
      </feComponentTransfer>
      <!-- ② 降饱和：去掉背景粉调与人物边缘彩边 -->
      <feColorMatrix type="saturate" values="0.85"/>
      <!-- ③ 逐通道白平衡（放最后）：把残存的暖灰底一次性推到纯白 -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.06"/>
        <feFuncG type="linear" slope="1.05"/>
        <feFuncB type="linear" slope="1.12"/>
      </feComponentTransfer>
    </filter>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ico = n => '<svg><use href="#i-' + n + '"/></svg>';

/* ---------- 标题规范化 ----------
   规则：去括号、去「与」；
   主标题与副标题之间统一用间隔号「·」，卡片内部并列子模块之间保留「+」。
   实现：优先按「·」切分（连接符显示 ·）；没有「·」时才按第一个「+」切分（连接符显示 +）。 */
function titleHTML(raw){
    const s = String(raw).replace(/[（(]/g, '').replace(/[）)]/g, '').replace(/与/g, '+');
    const iDot = s.indexOf('·');
    const iPlus = s.indexOf('+');
    const i = iDot >= 0 ? iDot : iPlus;
    const sep = iDot >= 0 ? '·' : '+';
    const main = i >= 0 ? s.slice(0, i) : s;
    const sub  = i >= 0 ? s.slice(i + 1) : '';
    return '<span class="t-main">' + main + '</span>'
         + (sub ? '<span class="t-plus">' + sep + '</span><span class="t-sub">' + sub + '</span>' : '');
}

/* ---------- 数字滚动 ---------- */
function animateNumber(el){
    const raw = el.dataset.count;
    const m = String(raw).match(/^([^\d]*)([\d.]+)(.*)$/);
    if (!m){ el.textContent = raw; return; }
    const pre = m[1], num = parseFloat(m[2]), post = m[3];
    const dec = (m[2].split('.')[1] || '').length;
    const dur = 1250, t0 = performance.now();
    (function step(t){
        const p = Math.min(1, (t - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = pre + (num * e).toFixed(dec) + post;
        if (p < 1) requestAnimationFrame(step);
    })(t0);
}
function startCounters(scope){
    $$('[data-count]', scope).forEach(el => { if (!el.dataset.done){ el.dataset.done = '1'; animateNumber(el); } });
}

/* ---------- 标签芯片 ---------- */
function chips(list, tone){
    const tones = ['', 'c-y', 'c-o', 'c-p', 'c-g'];
    return list.map((t, i) =>
        '<span class="chip ' + (tone || tones[i % tones.length]) + '" style="--d:' + (i * 62) + 'ms">' + t + '</span>'
    ).join('');
}

    /* 纯标签（可选：cover:true 在顶部加图片占位框；coverStyle:"frame" 加相框阴影）

       · tagsEven:true 标签按数量等分一行撑满整卡宽度 */
    tags(c){
        const wm = '<span class="card-wm">' + ico(c.wm || iconOf(c.type)) + '</span>';
        const extra = c.cover
            ? '<div class="ph ph-cover"'
              + ' style="margin-bottom:' + (c.coverGap ?? 14) + 'px;height:' + (c.coverH || 118) + 'px">'
              + ico('image') + '<span>' + (c.coverLabel || '图片占位') + '</span></div>'
            : '';
        const list = c.tags || [];
        const cls = 'chips chips-lg' + (c.cover ? '' : ' chips-fill')
                  + (c.tagsEven ? (c.cover ? ' chips-spread' : ' chips-even') : '');
        const st = (c.tagsEven && !c.cover)
            ? ' style="grid-template-columns:repeat(' + list.length + ',minmax(0,1fr))"' : '';
        return wm + extra + '<div class="' + cls + '"' + st + '>' + chips(list) + '</div>';

    /* 【本轮要求6】荣誉证书卡：两张并列的图片上传区
       · 两列等分 → 两张占位框的宽/高/圆角/边框完全一致
       · 每张图下方各挂一条说明标签，取代原来的单图 + 底部标签行
       【新阶段要求2】图片框高度由 imageH 显式锁定（160）→ 与「优秀毕业论文」卡的
       coverH(160) 分毫不差；配合 .cert-item 的 24px 间距，说明标签与论文卡的标签行同水平 */
    cert_pair(c){
        const wm = '<span class="card-wm">' + ico(c.wm || 'cert') + '</span>';
        const items = c.certImages || [];
        const h = c.imageH || 160;
        return wm + '<div class="cert-pair">' + items.map(it => `
            <div class="cert-item">
              <div class="ph ph-cover" style="height:${h}px">${ico('image')}<span>${it.label}</span></div>
              <div class="cert-cap">${it.cap}</div>

    },

    /* 标签 + 3D 翻转网格（gridCols:2 → 两行两列；gridCols:3 → 三行三列） */
    hybrid(c){
        const cols = c.gridCols || 2;
        const tones = ['b', 'o', 'p', 'v'];
        const tagRow = (c.tags && c.tags.length)
            ? '<div class="chips' + (c.tagsEven ? ' chips-even' : '') + '"'
              + ' style="margin-bottom:12px' + (c.tagsEven ? ';grid-template-columns:repeat(' + c.tags.length + ',minmax(0,1fr))' : '') + '">'
              + chips(c.tags) + '</div>'
            : '';
        return tagRow + `
        <div class="flip-grid${cols === 3 ? ' g3' : ''}">
          ${(c.projects || []).map((p, i) => `
            <button class="flip" type="button" data-tone="${tones[i % tones.length]}">
              <span class="flip-inner">
                <span class="flip-face flip-front">${p.name}</span>
                <span class="flip-face flip-back">${p.flipContent}</span>

    /* 双屏：6 阶段甘特图（下方阶段节点平分宽度）+ IPD 体系树（标签拉宽撑满） */
    custom(c){
        const labels = c.gantt || ['需求', '立项', '开发', '验证', '试产', '发布'];
        const widths = [42, 64, 86, 58, 74, 96];
        const bars = labels.map((t, i) => `
          <div class="gantt-row">
            <span>${t}</span>
            <div class="gantt-track"><div class="gantt-bar g${(i % 4) + 1}b" style="width:${widths[i % widths.length]}%;--d:${i * 120}ms"></div></div>

        const stages = labels.map((t, i) =>
          '<div class="gantt-stage" style="--d:' + (i * 120) + 'ms">' + t + '</div>').join('');
        const tree = c.tree || { root: 'IPD 体系', nodes: [] };
        const treeHTML = (tree.nodes || []).map((n, i) => `
          <div class="tree-group">

       右：专家大模型 —— 顶部同样一行 3 个标签 + 原有「感知→分析→预警→归档」管线（保持不动）
       【本轮要求9】拆卡支持：c.side='left' | 'right' 时只输出对应的那一个 pane，
       并用 .dual.solo 把双栏压成单栏；pane 内部结构一行未改 */

              </div>

        return `<div class="dual ai-spread${c.side ? ' solo' : ''}">${boxes}</div>`;

    /* 安检通道动态场景（纯代码）+ AI监控总览与三条执行路径
       左：无人化安检通道（自动闸门开合 / 扫描光带 / 包裹自动流转）
       右：AI 监控总览 + 三条并行执行路径
       【本轮要求9】拆卡支持：c.side='left' | 'right' 时只输出对应的那一个 pane */
    digital_dual(c){
        const m = c.modules || [];
        const dash = m.find(x => x.style === 'dashboard') || m[0] || {};
        const mon  = m.find(x => x.style === 'radar') || m[1] || {};

        const splitNum = (raw) => {
            const mm = String(raw).match(/^([^\d]*)([\d.]+.*)$/);
            return mm ? { label: mm[1].trim() || '—', value: mm[2] } : { label: '—', value: String(raw) };

          <circle class="g-led" cx="148" cy="12" r="3.2" style="animation-delay:.8s"/>
          <rect class="g-parcel" x="-24" y="78" width="20" height="16" rx="3"/>

          <text class="g-badge-t" x="110" y="123.6" text-anchor="middle">AUTO · 无人值守</text>
        </svg>`;
        /* 【要求5】右侧 AI 监控：上排 3 个总览块（异常行为识别 / 自动弹窗告警 / 大场景覆盖）
           中排 3 条执行路径不变；「调查询问」标签拆成两行并补上与其他两条一致的进度条 */
        const ovBlock = (icon, alar, num, label) => `
          <div class="ai-ov">
            <span class="ai-ov-ico${alar ? ' alarm' : ''}">${ico(icon)}</span>

          </div>`;
        const overviewHTML = (mon.overview || [
            { icon: 'camera', num: '40+',  label: '异常行为识别' },
            { icon: 'alarm',  num: '100%', label: '自动弹窗告警', alarm: true },
            { icon: 'grid',   num: '4',    label: '大场景覆盖' }
        ]).map(o => ovBlock(o.icon || 'camera', o.alarm, o.num, o.label)).join('');
        const paneLeft = `
          <div class="pane">
            <div class="pane-label">${ico('scan')}${dash.name || '安检岗点无人化'}</div>
            <div class="gate-row">
              <div class="gate-scene">${gateSVG}</div>
              <div class="stat-grid">${stat(0)}${stat(1)}${stat(2)}${stat(3)}</div>
            </div>
          </div>`;
        const paneRight = `
          <div class="pane">

              <div class="path-row">

                  <div class="path-card" data-tone="${tones3[i % 3]}">

                    <div class="path-bar"><i style="width:${p.progress || 60}%;--d:${i * 200}ms"></i></div>
                    ${p.tagRows
                      ? '<div class="path-tags-2">' + p.tagRows.map(r =>
                          '<div class="ptr">' +
                          r.map(t => '<span class="path-tag">' + t + '</span>').join('') + '</div>').join('') + '</div>'

    pmp_certificate(c){

        const boxes = c.side === 'left' ? paneLeft : c.side === 'right' ? paneRight : paneLeft + paneRight;
        const needOverlay = c.side !== 'left';
        return `<div class="dual${c.side ? ' solo' : ''}">${boxes}</div>` + (needOverlay ? overlay : '');
    }
};

        const accents = ['blue', 'yellow', 'pink', 'lime'];

          <div class="node-head">
            <span class="node-name">${node.nodeName}</span>
            <span class="node-time">${ico('clock')}${node.time}</span>
            <span class="node-line"></span>
          </div>
          <div class="node-grid ${gridCls}">
            ${node.cards.map((c, ci) => {
                const r = renderers[c.type] || renderers.tags;
                return `
                <div class="card" data-accent="${accents[ni % accents.length]}" data-key="${norm(c.title)}" data-anim style="--d:${ci * 90}ms">
                  <div class="card-head">

                    <div class="card-title">${titleHTML(c.title)}</div>

                  </div>

            }).join('')}
          </div>
        </div>`;
    }).join('');
}
function norm(t){ return String(t).replace(/[（(].*?[）)]/g, '').replace(/与/g, '+'); }
/* 卡片图标：优先用配置里的 icon，没写才按类型取默认值 */
function iconOf(c){
    if (c && typeof c === 'object'){
        if (c.icon) return c.icon;
        c = c.type;
    }
    return ({ douyin: 'douyin', tags: 'star', hybrid: 'chart', custom: 'flow',
              ai_dual: 'brain', digital_dual: 'scan', pmp_certificate: 'cert',
              cert_pair: 'medal' })[c] || 'star';
}

    //  · 纯数组 [t1,t2,...]        → 该行 space-between 等宽铺满（与「AI应用」参考标准一致）
    //  · { tags:[...], start:true } → 该行左对齐自然宽度（项目管理/数据分析的第二行单标签）
    const rowHTML = r => {
        const tags = Array.isArray(r) ? r : r.tags;

/* ============================================================
   交互：视图切换
   ============================================================ */
let currentView = 'view-home';
function goto(id){
    if (!document.getElementById(id)) return;
    currentView = id;
    $$('.view').forEach(v => v.classList.toggle('active', v.id === id));
    $$('.nav-pill').forEach(p => p.classList.toggle('on', p.dataset.goto === id));
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e){}

    // 激活后立刻点亮当前视口内的元素，并启动其中的数字滚动
    requestAnimationFrame(() => {
        setTimeout(() => {
            const view = document.getElementById(id);
            $$('[data-anim]', view).forEach(el => {
                const r = el.getBoundingClientRect();
                if (r.top < window.innerHeight * 1.05 && r.bottom > -40){
                    el.classList.add('is-in');
                    startCounters(el);   // 手动点亮的元素也要跑数字，不能只等 IO
                }
            });
        }, 60);
    });

    // GSAP 增强：视图整体轻推入（无 GSAP 时由 CSS 兜底）
    // 【需求2】首页例外：一旦给 #view-home 留下 transform，首屏视频的 mix-blend-mode
    // 就会被切成一块「孤立背板」，融合效果当场失效 → 首页改由 heroChoreography 负责入场
    if (window.gsap && id !== 'view-home'){
        gsap.fromTo('#' + id, { opacity: .35, y: 22 }, { opacity: 1, y: 0, duration: .55, ease: 'power3.out', clearProps: 'transform' });
    }
}

/* ============================================================
   交互：通用绑定
   ============================================================ */
function bindAll(){
    // 视图切换
    $$('[data-goto]').forEach(el => el.addEventListener('click', () => goto(el.dataset.goto)));

    // 3D 翻转卡：点击翻转看背面，停留 2 秒后自动弹回正面（全站统一）
    $$('.flip').forEach(f => f.addEventListener('click', () => {
        const on = f.classList.toggle('on');
        clearTimeout(f._flipTimer);
        /* 【需求1】编辑模式下**取消自动翻回**：
           原来 2 秒一到就把卡转回正面，用户根本来不及看清、更别说改背面的字。
           编辑模式靠右上角的「⇄」按钮手动翻转，翻过去就一直停在背面，
           直到你点「⇄」翻回来 —— 这样背面文字才有足够时间被编辑。
           非编辑模式维持原样（2 秒后自动弹回），纯展示的动效完全不变。
           ★ 注意：这里必须直接读 body 上的 edit-on class，不能调用 isEditing()。
             本段代码属于「页面渲染脚本」，而 isEditing() 定义在后面的「外挂编辑器脚本」里，
             两者不在同一个作用域 → 调用它会抛 ReferenceError：isEditing is not defined，
             结果是点击后翻转动画正常，但自动回弹的定时器永远挂不上。
             直接读 class 两个脚本都能拿到，这样跨作用域也安全。 */
        if (on && !document.body.classList.contains('edit-on')) {
            f._flipTimer = setTimeout(() => f.classList.remove('on'), 2000);
        }
    }));

    // PMP 证书：底部滑出（非翻转）
    $$('[data-cert]').forEach(btn => {
        const card = btn.closest('.card');
        btn.addEventListener('click', () => card.classList.add('cert-open'));
    });
    $$('[data-cert-close], [data-cert-overlay]').forEach(el => {
        el.addEventListener('click', e => {
            if (e.target.closest('.cert-sheet') && !e.target.closest('[data-cert-close]')) return;
            el.closest('.card').classList.remove('cert-open');
        });
    });

    // 点击技能 → 跳到相关经历并高亮
    $$('.skill-item').forEach(btn => {
        btn.addEventListener('click', e => {
            e.stopPropagation();
            jumpToCard(btn.dataset.target);
        });
    });
}

/* ============================================================
   交互：技能 → 跳转并高亮相关经历
   ============================================================ */
let flashTimer = null;
function jumpToCard(keyword){
    if (!keyword) return;
    const k = norm(keyword);
    const hit = $$('[data-key]').find(el => el.dataset.key.indexOf(k) >= 0);
    if (!hit) return;

    const view = hit.closest('.view');
    goto(view.id);

    setTimeout(() => {
        // 父级全部点亮，保证卡片可见
        let p = hit.parentElement;
        while (p && p !== document.body){ if (p.hasAttribute && p.hasAttribute('data-anim')) p.classList.add('is-in'); p = p.parentElement; }
        hit.classList.add('is-in');
        startCounters(hit);

        // 先高亮再滚动，避免滚动失败时丢失视觉反馈
        clearTimeout(flashTimer);
        $$('.flash').forEach(el => el.classList.remove('flash'));
        void hit.offsetWidth;
        hit.classList.add('flash');
        flashTimer = setTimeout(() => hit.classList.remove('flash'), 3200);

        if (typeof hit.scrollIntoView === 'function'){
            try { hit.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e){}
        }
    }, 420);
}

/* ============================================================
   入场动画：IntersectionObserver 逐张点亮 + 触发数字滚动
   ============================================================ */
function initReveal(){
    if (!('IntersectionObserver' in window)){
        $$('[data-anim]').forEach(el => el.classList.add('is-in'));
        $$('[data-count]').forEach(animateNumber);
        return;
    }
    const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (!en.isIntersecting) return;
            en.target.classList.add('is-in');
            startCounters(en.target);
            io.unobserve(en.target);
        });
    }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });

    $$('[data-anim]').forEach(el => io.observe(el));

    // 首屏立即点亮
    setTimeout(() => {
        $$('#view-home [data-anim]').forEach(el => el.classList.add('is-in'));
        startCounters($('#view-home'));
    }, 90);
}

/* ============================================================
   首屏 GSAP 精细编排（无 GSAP 时自动跳过，CSS 已兜底）
   ============================================================ */
function heroChoreography(){
    // 首屏不走 [data-anim] 的 CSS 点亮，改由 GSAP 用 fromTo 显式控制起止值，
    // 避免「CSS 未点亮 opacity:0」被当成终点而把元素永久锁在透明。
    if (!window.gsap) return;
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.fromTo('.hero-tagline', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .5 })
      .fromTo('.hero-name', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .7 }, '-=.3')
      .fromTo('.hero-roles .role', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .45, stagger: .07 }, '-=.36')
      .fromTo('.hero-entries .entry', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .5, stagger: .08 }, '-=.26')
      /* 【需求2】形象卡只做淡入、不做缩放：GSAP 只要在这条链路上留下 transform，
         首屏视频的 mix-blend-mode 就会失效（背板被切断） */
      .fromTo('.hero-visual', { opacity: 0 }, { opacity: 1, duration: .62 }, '-=.6')
      .fromTo('.float-chip', { opacity: 0 }, { opacity: 1, duration: .5, stagger: .1 }, '-=.34');
}

/* ============================================================
   启动
   ============================================================ */
(function init(){
    renderChrome();
    renderTimeline();
    renderProjects();
    renderSkills();
    bindAll();
    initReveal();
    heroChoreography();
    goto('view-home');
    // 首屏导航高亮清空（首页没有对应入口）
    $$('.nav-pill').forEach(p => p.classList.remove('on'));
})();

        · 微博 / 小红书 头像             → 1:1 裁剪，圆形填充
        · 市场调研 4 张卡              → 背景图（同样先裁剪）+ 透明度调节
     ③ 视频：首屏 hero.mp4 + 陕西广电 morning.mp4 / douyin.mp4 全部是本地文件，
        没有上传入口；卡内静音循环，点击弹大屏模态框并取消静音
     ④ 昵称 / 联系方式 / 所有数据均可直接编辑
     ⑤ 全部改动写入 localStorage（键名 LLJ_PORTFOLIO_EDIT_V1）
     ============================================================ -->
<style>
/* ---------- 上传位 ---------- */
.up-slot{ position:relative; cursor:pointer; }
.up-slot.has-media{ cursor:default; }
.up-media{ position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:inherit; }
video.up-media{ background:#000; object-fit:contain; }
.up-slot:not(.up-keep) img.up-media{ object-fit:cover; }
.up-slot.up-keep .up-media{ object-fit:contain; }
/* 【需求5】裁剪过的图片：比例已与目标框完全一致 → 用 cover 完美铺满，绝不变形 */
.up-slot.up-crop img.up-media{ object-fit:cover; }
/* 非虚线框类（视频 / 头像）：上传后取消占位虚线与底色 */
.ph.up-slot.has-media:not(.up-keep){ border:none; background:transparent; padding:0; }
/* 【需求3】头像上传后：改为实线白描边（并在外围留出删除按钮的位置）。
   ★ 这里故意不写 overflow:hidden —— 否则悬浮时右上角的「删除」按钮会被圆形裁掉。
     图片本身的圆形裁切由 .up-media 的 border-radius:inherit 完成，效果完全一样。 */
.sph-av.up-slot.has-media{ border-style:solid; border-color:rgba(255,255,255,.94); background:#fff; }
/* 空占位 hover 提示（绝对定位，不占布局） */
.up-slot:not(.has-media)::after{
  content:attr(data-up-hint); position:absolute; left:50%; bottom:9px; transform:translateX(-50%);
  white-space:nowrap; font-size:10px; font-weight:800; letter-spacing:.2px; color:var(--blue-d);
  background:rgba(255,255,255,.94); border:1px solid rgba(27,132,240,.22); border-radius:999px;
  padding:3px 9px; opacity:0; transition:.22s; pointer-events:none; z-index:3;
}
.phone-screen .up-slot:not(.has-media)::after{ bottom:auto; top:50%; transform:translate(-50%,-50%); }
/* 【需求2·权限总开关】空位提示「点击上传…」只在编辑模式出现。
   ★ 原来这里还挂着 `.up-slot:not(.has-media):hover::after{opacity:1}` ——
     那意味着非编辑模式下鼠标一悬浮就冒气泡，等于把「可上传」这件事漏给了访客。
     现在整条规则只认 body.edit-on，关闭编辑模式后页面是纯展示状态：
     没有气泡、没有小手、没有任何「点击更换」暗示。 */
body.edit-on .up-slot:not(.has-media)::after{ opacity:1; }
/* 非编辑模式下上传位不显示「可点」的手型光标（编辑模式才给 pointer） */
body:not(.edit-on) .up-slot{ cursor:inherit; }
/* 【需求2】已上传图片的「点击更换」提示遮罩
   · 只在编辑模式下、鼠标悬浮时出现 → 半透明遮罩 + 居中文字
   · 原来右下角的「小圆圈 + 箭头」图标已彻底删除，这里取而代之
   · pointer-events:none → 只是视觉层，不挡点击（点击事件仍然落在 .up-slot 上） */
.up-slot.has-media::before{
  content:'点击更换';
  position:absolute; inset:0; z-index:5;
  display:grid; place-items:center;
  border-radius:inherit;

/* ---------- 【需求3】已上传图片的「删除」按钮 ----------
   · 只在「编辑模式 + 鼠标悬浮」时出现；非编辑模式完全不可见、也点不到
   · 点它 → 删掉这张图，恢复默认占位框（虚线框 + 图标 + 文字）
   · z-index 比上面的「点击更换」遮罩高一层，所以永远压在遮罩之上、点得到

/* ---------- 编辑模式 ---------- */
body.edit-on [data-edit-id]{ outline:1px dashed rgba(27,132,240,.42); outline-offset:2px; border-radius:5px; }
body.edit-on [data-edit-id]:hover{ outline:2px dashed rgba(27,132,240,.95); }

/* ---------- 【需求3】修复「编辑模式下打不出空格」 ----------
   根因（不是 JS 拦截，键盘事件里根本没有拦空格）：
     contenteditable 遇到「连续空格 / 行尾空格」时会插入 &nbsp;（U+00A0），
     而浏览器默认的 white-space:normal 会把行尾空格「折叠」掉 →
     光标明明往后走了、字符也进了 DOM，视觉上却不占宽度，看起来就是「空格打不进去」。
   解法：编辑模式下把所有可编辑元素的 white-space 提升为 pre-wrap
     · pre-wrap = 保留空格与换行，同时**仍然允许自动折行** → 长句不会冲出容器

     pre = 保留空格 + 不折行 —— 正好等价于「nowrap，但不再吞掉空格」。 */
body.edit-on [data-edit-id]{ white-space:pre-wrap; }

<script>
(function(){
'use strict';

/* ============================================================
   0. 本地存储
   ============================================================ */
var KEY = 'LLJ_PORTFOLIO_EDIT_V1';
var store = { text:{}, size:{}, media:{}, bg:{} };
try {
    var raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    store.text  = raw.text  || {};
    store.size  = raw.size  || {};
    store.media = raw.media || {};
    store.bg    = raw.bg    || {};
} catch(e){}

var saveTimer = null;
function save(){
    try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
    catch(e){
        toast('保存失败：本地存储已满（浏览器上限约 5MB）。请换体积更小的图片/视频，否则刷新后会丢失。', 'err');
        return false;
    }
}
function debSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

/* ---------- 提示条 ---------- */
var toastEl = null, toastTimer = null;
function toast(msg, type){
    if(!toastEl){
        toastEl = document.createElement('div');
        toastEl.id = 'upToast';   /* 供「可编辑文本收集」排除，避免提示条被误识别为可编辑文案 */
        toastEl.className = 'up-toast';
        document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.className = 'up-toast show' + (type === 'err' ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = 'up-toast'; }, 4600);
}

/* ============================================================
   1. 元素唯一标识（DOM 结构路径，跨刷新稳定）
   ============================================================ */
var usedIds = {};
function pathOf(el){
    var parts = [], cur = el, guard = 0;
    while(cur && cur !== document.body && guard < 25){
        guard++;
        var seg = cur.tagName.toLowerCase();
        var cls = (typeof cur.className === 'string' ? cur.className : '')
                  .trim().split(/\s+/).filter(Boolean)
                  .filter(function(c){ return c.indexOf('up-') !== 0 && c !== 'edit-on'; })
                  .slice(0, 2).join('.');
        if(cls) seg += '.' + cls;
        var p = cur.parentElement;
        if(p){
            var kids = p.children, idx = 0, seen = 0;
            for(var i = 0; i < kids.length; i++){
                if(kids[i] === cur){ idx = seen; break; }
                if(kids[i].tagName === cur.tagName) seen++;
            }
            seg += '[' + idx + ']';
        }
        parts.unshift(seg);
        cur = p;
    }
    var v = el.closest('.view');
    return (v ? '#' + v.id : '#chrome') + ' ' + parts.join('>');
}
function ensureId(el){
    if(el.dataset.editId) return el.dataset.editId;
    var base = pathOf(el), id = base, n = 1;
    while(usedIds[id]){ id = base + '#' + (++n); }
    usedIds[id] = 1;
    el.dataset.editId = id;
    return id;
}

/* ============================================================
   2. 文件选择 + FileReader（不用 URL.createObjectURL，dataURL 才能持久化）
   ============================================================ */
function pickFile(accept, cb){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept || '';
    inp.style.position = 'fixed';
    inp.style.left = '-9999px';
    document.body.appendChild(inp);
    /* 用户点了「取消」不会触发 change，兜底 90 秒后自行清理，避免残留隐藏 input */
    setTimeout(function(){ if(inp.parentNode) inp.parentNode.removeChild(inp); }, 90000);
    inp.addEventListener('change', function(){
        var f = inp.files && inp.files[0];
        if(f) cb(f);
        setTimeout(function(){ if(inp.parentNode) inp.parentNode.removeChild(inp); }, 400);
    });
    inp.click();
}
function readURL(file, cb){
    var fr = new FileReader();
    fr.onload = function(){ cb(String(fr.result)); };
    fr.onerror = function(){ toast('文件读取失败，请重试', 'err'); };
    fr.readAsDataURL(file);
}

/* ============================================================
   3. 媒体上传位（图片 / 视频 / 头像）
   ============================================================ */
/* 【需求2】统一的「现在是编辑模式吗？」判断
   直接读 body 上的 edit-on class（由 setEdit / Ctrl+Shift+E 控制），
   不依赖 editOn 变量的初始化时机，任何地方调用都拿得到正确结果 */
function isEditing(){
    return document.body.classList.contains('edit-on');
}

function renderMedia(el, opt, rec){
    /* 【要求】占位图标与提示文字：从 DOM 中彻底删除，不是隐藏 */
    Array.prototype.slice.call(el.children).forEach(function(c){ c.remove(); });
    var m;
    if(opt.kind === 'video'){
        m = document.createElement('video');
        m.src = rec.src;
        m.controls = true;
        m.playsInline = true;
        m.setAttribute('playsinline', '');

        m = document.createElement('img');
        m.src = rec.src;
        m.alt = rec.name || '';

    m.className = 'up-media';
    el.appendChild(m);

    /* 【需求2】这里原本会再插一个右下角「⟳ 小圆圈」按钮，现已彻底删除。
       重新上传改为：编辑模式下直接点击已上传的图片本身（见 makeMediaSlot 的 click 处理），

    /* 【需求3】编辑模式下的「删除」按钮：
       · 只在编辑模式悬浮时才显示（CSS 控制），点了就删图并恢复默认占位框
       · 圆形小头像（opt.compact）用紧凑版：只有一枚 ✕，贴在圆的右上外沿

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'up-del' + (opt.compact ? ' up-del-mini' : '');
    del.setAttribute('data-up-del', '1');
    del.title = '删除这张图片，恢复默认占位框';
    del.innerHTML = opt.compact ? '\u2715' : '\u2715 删除';
    el.appendChild(del);

    /* 【需求5】裁剪过的图：比例已经和目标框一致 → 用 cover 完美铺满（绝不变形） */
    el.classList.toggle('up-crop', !!(rec && rec.cropped));
    el.classList.add('has-media');

function makeMediaSlot(el, id, opt){

    el.classList.add('up-slot');
    if(opt.keepFrame) el.classList.add('up-keep');
    if(opt.hint) el.setAttribute('data-up-hint', opt.hint);

    /* 【需求3】把「默认占位框」那一段原始 HTML 先存下来 —— 这是删除后能一键还原的关键。
       renderMedia 会把占位内容整体删掉（不是隐藏），所以必须在它动手之前抓一份快照。
       存在元素自己的 data-ph-html 上，刷新页面后依然有效。 */
    if(el.getAttribute('data-ph-html') == null) el.setAttribute('data-ph-html', el.innerHTML);

    var rec = store.media[id];
    if(rec && rec.src){ try { renderMedia(el, opt, rec); } catch(e){} }

    function commit(src, f, cropped){
        store.media[id] = { src: src, name: f.name, kind: opt.kind, cropped: !!cropped };
        save();
        renderMedia(el, opt, store.media[id]);
        toast((opt.kind === 'video' ? '视频' : '图片') + (cropped ? '已裁剪并保存：' : '已上传并保存：') + f.name);

    /* 【需求3】删除：清掉存档 + 还原占位框 + 去掉 has-media / up-crop 两个状态类。

    function clearMedia(){
        delete store.media[id];
        save();
        el.classList.remove('has-media', 'up-crop');
        el.innerHTML = el.getAttribute('data-ph-html') || '';
        toast('图片已删除，已恢复默认占位框');
    }

    function doPick(){
        pickFile(opt.accept, function(f){
            if(!sizeWarn(f)) return;
            readURL(f, function(src){
                if(opt.kind === 'video'){ commit(src, f, false); return; }
                /* 【需求5】所有图片位都先弹裁剪框：
                   · 头像类固定 1:1（opt.cropRatio = 1）
                   · 其余一律取「目标框当前的实际宽高比」→ 裁剪框与目标区域比例一定一致 */

                    commit(out, f, true);
                }, opt.cropTip);
            });
        });
    }
    /* 【需求2】上传位的唯一入口：编辑模式下点击本区域
       · 编辑模式（Ctrl / Cmd + Shift + E 开启）：
           - 空位   → 弹出文件选择框，选完照旧走裁剪（需求5）
           - 已有图 → 同样弹出文件选择框「重新上传 / 更换」，选完照样能重新裁剪
       · 非编辑模式：直接 return，纯展示，点击不触发任何上传动作
       · 【需求3】新增分支：如果点的是右上角那枚「删除」按钮 → 走删除，不弹选图框 */
    el.addEventListener('click', function(e){
        e.stopPropagation();
        if(!isEditing()) return;      /* 非编辑模式 → 只展示，不可替换 / 不可删除 */
        if(e.target && e.target.closest && e.target.closest('[data-up-del]')){ clearMedia(); return; }
        doPick();
    });
    return el;
}

/* 【需求5】目标框的宽高比 = 该元素当前渲染出来的 宽 / 高
   （点击时页面一定可见，所以量得到真实比例；极端情况下退回 aspect-ratio 或 1:1） */
function rectRatio(el){
    var r = el.getBoundingClientRect();
    if(r.width > 4 && r.height > 4) return r.width / r.height;
    var ar = parseFloat(getComputedStyle(el).aspectRatio);
    return (ar && isFinite(ar)) ? ar : 1;

/* ============================================================

   · 裁剪框宽高比 = --crop-ratio，由 JS 按目标区域实时写入 → 比例一定一致
   · 操作：拖拽移动画面 / 滚轮或滑块缩放 / 复位 / 取消 / 确认裁剪

   · 取消 → 直接关窗，什么都不改，原图原样保留
   ============================================================ */
var cropModal = null, cropStage = null, cropImg = null, cropRange = null, cropRatioTag = null, cropTipEl = null;
/* 默认提示语（无自定义 cropTip 时还原用，避免上一次的提示残留到下一次裁剪） */
var CROP_TIP_DEFAULT = '在图片上<b>拖拽</b>移动位置，用<b>滚轮 / 滑块</b>缩放；框内区域 = 最终效果，比例已锁定';
var cropState = { S:1, z:1, tx:0, ty:0, W:0, H:0, nw:0, nh:0, cb:null };

function buildCropper(){
    cropModal = document.createElement('div');
    cropModal.className = 'crop-modal';
    cropModal.innerHTML =
        '<div class="crop-box">' +
          '<div class="crop-head"><b>裁剪图片</b><i id="cropRatioTag"></i></div>' +
          '<div class="crop-stage" id="cropStage">' +
            '<img class="crop-img" id="cropImg" alt="">' +
            '<div class="crop-grid"></div>' +
          '</div>' +
          '<p class="crop-tip">' + CROP_TIP_DEFAULT + '</p>' +
          '<div class="crop-zoom">' +
            '<button class="up-ib" type="button" data-z="out" title="缩小">－</button>' +
            '<input type="range" id="cropRange" min="100" max="400" step="1" value="100">' +
            '<button class="up-ib" type="button" data-z="in" title="放大">＋</button>' +
            '<button class="up-ib" type="button" data-z="reset" style="font-size:11.5px">复位</button>' +
          '</div>' +
          '<div class="crop-acts">' +
            '<button class="crop-btn" type="button" data-c="cancel">取消</button>' +
            '<button class="crop-btn primary" type="button" data-c="ok">确认裁剪</button>' +
          '</div>' +
        '</div>';
    document.body.appendChild(cropModal);
    cropStage     = cropModal.querySelector('#cropStage');
    cropImg       = cropModal.querySelector('#cropImg');
    cropRange     = cropModal.querySelector('#cropRange');
    cropRatioTag  = cropModal.querySelector('#cropRatioTag');
    cropTipEl     = cropModal.querySelector('.crop-tip');

    /* 拖拽移动 */
    var drag = null;
    cropStage.addEventListener('pointerdown', function(e){
        if(!cropImg.getAttribute('src')) return;
        drag = { x:e.clientX, y:e.clientY, tx:cropState.tx, ty:cropState.ty, id:e.pointerId };
        try { cropStage.setPointerCapture(e.pointerId); } catch(err){}
        e.preventDefault();
    });
    cropStage.addEventListener('pointermove', function(e){
        if(!drag || e.pointerId !== drag.id) return;
        cropState.tx = drag.tx + (e.clientX - drag.x);
        cropState.ty = drag.ty + (e.clientY - drag.y);
        clampCrop(); drawCrop();
    });
    cropStage.addEventListener('pointerup', function(e){ if(drag && e.pointerId === drag.id) drag = null; });
    cropStage.addEventListener('pointercancel', function(){ drag = null; });
    window.addEventListener('pointerup', function(){ drag = null; });

    /* 滚轮缩放 */
    cropStage.addEventListener('wheel', function(e){
        e.preventDefault();
        zoomCrop(cropState.z * (e.deltaY < 0 ? 1.08 : 0.926));
    }, { passive:false });

    cropRange.addEventListener('input', function(){ zoomCrop(parseInt(cropRange.value, 10) / 100); });

    /* 按钮 */
    cropModal.addEventListener('click', function(e){
        var z = e.target.closest('[data-z]'), c = e.target.closest('[data-c]');
        if(z){
            var a = z.dataset.z;
            if(a === 'in')     zoomCrop(cropState.z * 1.12);
            if(a === 'out')    zoomCrop(cropState.z / 1.12);
            if(a === 'reset')  resetCrop();
        }
        if(c){ c.dataset.c === 'ok' ? confirmCrop() : closeCropper(); }
    });
    /* 防误选中文字，但不拦 input / button 的默认行为 */
    cropModal.addEventListener('mousedown', function(e){
        if(e.target.closest('input, button')) return;
        e.preventDefault();
    });
}

function clampCrop(){
    var st = cropState, w = st.nw * st.S * st.z, h = st.nh * st.S * st.z;
    st.tx = Math.min(0, Math.max(st.W - w, st.tx));
    st.ty = Math.min(0, Math.max(st.H - h, st.ty));
}
function drawCrop(){
    var st = cropState;
    cropImg.style.width  = (st.nw * st.S) + 'px';
    cropImg.style.height = (st.nh * st.S) + 'px';
    cropImg.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.z + ')';
}
function resetCrop(){
    var st = cropState;
    st.z  = 1;
    st.tx = (st.W - st.nw * st.S) / 2;   /* 居中：图片比框大多少，就偏移一半 */
    st.ty = (st.H - st.nh * st.S) / 2;
    if(cropRange) cropRange.value = 100;
    clampCrop(); drawCrop();
}
function zoomCrop(z){
    var st = cropState;
    z = Math.max(1, Math.min(4, z));
    if(Math.abs(z - st.z) < 0.002) return;
    /* 以裁剪框中心为锚点缩放 → 画面不会乱跑 */
    var cx = st.W / 2, cy = st.H / 2;
    var qx = (cx - st.tx) / (st.S * st.z), qy = (cy - st.ty) / (st.S * st.z);
    st.z = z;
    st.tx = cx - qx * st.S * st.z;
    st.ty = cy - qy * st.S * st.z;
    if(cropRange) cropRange.value = Math.round(st.z * 100);
    clampCrop(); drawCrop();
}
function openCropper(src, ratio, label, cb, tip){
    if(!cropModal) buildCropper();
    ratio = (ratio && isFinite(ratio) && ratio > 0) ? ratio : 1;
    cropRatioTag.textContent = label + ' · 比例 ' + ratio.toFixed(3) + ' : 1';
    /* 自定义提示语（如头像的「请框选合适区域」）；没传就还原默认，避免上一次的残留 */
    if(cropTipEl) cropTipEl.innerHTML = tip || CROP_TIP_DEFAULT;
    cropStage.style.setProperty('--crop-ratio', ratio);
    cropModal.classList.add('show');          /* 先显示，才能量到裁剪框的真实像素尺寸 */
    cropImg.removeAttribute('src');
    cropImg.onload = function(){
        var r = cropStage.getBoundingClientRect();
        cropState.W  = r.width;
        cropState.H  = r.height;
        cropState.nw = cropImg.naturalWidth  || 1;
        cropState.nh = cropImg.naturalHeight || 1;
        /* 基础缩放 S：让图片刚好「盖住」裁剪框（cover），此后只能放大、不会露白 */
        cropState.S  = Math.max(cropState.W / cropState.nw, cropState.H / cropState.nh);
        cropState.cb = cb;
        resetCrop();
    };
    cropImg.src = src;
}
function closeCropper(){
    if(!cropModal) return;
    cropModal.classList.remove('show');
    cropState.cb = null;
    cropImg.onload = null;
    cropImg.removeAttribute('src');
}
function confirmCrop(){
    var st = cropState;
    if(!cropImg.getAttribute('src') || !st.nw){ closeCropper(); return; }
    /* 裁剪框在「原图像素坐标系」里的位置与大小 */
    var sx = (-st.tx) / (st.S * st.z);
    var sy = (-st.ty) / (st.S * st.z);
    var sw = st.W / (st.S * st.z);
    var sh = st.H / (st.S * st.z);
    /* 输出尺寸：最多 1:1 原图，长边压到 1400px 以内 */
    var k  = Math.min(1, 1400 / Math.max(sw, sh));
    var cv = document.createElement('canvas');
    cv.width  = Math.max(1, Math.round(sw * k));
    cv.height = Math.max(1, Math.round(sh * k));
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';                       /* PNG 透明区转 JPEG 时垫白，避免变黑 */
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(cropImg, sx, sy, sw, sh, 0, 0, cv.width, cv.height);

    var out = cv.toDataURL('image/jpeg', 0.86);
    var q = 0.86;
    while(out.length > 800000 && q > 0.4){        /* 压到约 600KB 以内，给 localStorage 留余量 */
        q -= 0.15;
        out = cv.toDataURL('image/jpeg', q);
    }
    var cb = st.cb;
    closeCropper();
    if(cb) cb(out);
}

/* ============================================================
   4. 市场调研 4 张项目卡：背景图 + 透明度
   ============================================================ */
var bgTarget = null, bgRange = null, bgVal = null, bgPop = null;

function applyBg(front, rec){
    var img = front.querySelector('.flip-bg');
    if(!img){
        img = document.createElement('img');
        img.className = 'flip-bg';
        img.alt = '';
        front.insertBefore(img, front.firstChild);
    }
    img.src = rec.src;
    img.style.opacity = (rec.opacity == null ? 0.55 : rec.opacity);
    front.classList.add('has-bg');
    syncBgHint(front);
}

/* 【需求2】翻转卡正面悬浮遮罩的文案来自 data-bg-hint：
   · 已有背景图 → 「点击更换」
   · 还没有     → 「点击上传背景图」
   （遮罩本身由 CSS .flip-front::before 绘制，只在编辑模式悬浮时出现） */
function syncBgHint(front){
    if(!front) return;
    front.setAttribute('data-bg-hint', front.classList.contains('has-bg') ? '点击更换' : '点击上传背景图');
}

function pickBgImage(front, id){
    pickFile('image/*', function(f){
        if(!sizeWarn(f)) return;
        readURL(f, function(src){
            /* 【需求5】4 张项目背景图同样先裁剪：
               裁剪框比例 = 这张翻转卡正面的实际比例 → 裁完 cover 铺满，绝不拉伸变形 */
            openCropper(src, rectRatio(front), '项目背景图', function(out){
                var prev = store.bg[id] || {};
                store.bg[id] = { src: out, opacity: (prev.opacity != null ? prev.opacity : 0.55) };
                save();
                applyBg(front, store.bg[id]);
                toast('背景图已裁剪并保存。想调透明度 / 换图：编辑模式下再点一次这张卡片的正面即可');
            });
        });
    });
}
function sizeWarn(f){
    var mb = f.size / 1048576;
    if(mb <= 6) return true;
    return confirm('原图约 ' + mb.toFixed(1) + 'MB。\n裁剪后会自动压缩到 1MB 以内再存入浏览器本地存储（localStorage 上限约 5MB）。\n\n继续吗？');
}

function setupBgSlots(){
    var card = document.querySelector('.card[data-key*="市场调研"]');
    if(!card) return;
    Array.prototype.forEach.call(card.querySelectorAll('.flip'), function(flip, i){
        var front = flip.querySelector('.flip-front');
        if(!front) return;
        var id = 'mr-flip-bg-' + i;

        /* 【需求2】打上专用标记类：
           · CSS 用它挂「点击更换」遮罩（不波及页面上其他 9 张翻转卡）
           · bindEditor 的编辑模式拦截逻辑也靠它放行，否则点文字区域会被拦掉、
             背景图入口就点不到了 */
        front.classList.add('up-flip-front');

        /* 【需求2】原来右下角的「⇪ 小圆圈」按钮已彻底删除。
           改为整张卡片正面承担入口，且只在编辑模式下生效：
           · 非编辑模式 → 不拦截，点击照旧触发翻转看背面（纯展示）
           · 编辑模式   → 拦下翻转，改为：还没有背景图就直接选图；已有背景图则打开面板
                          （面板里可以换图 / 拖滑块调透明度 / 移除） */
        front.addEventListener('click', function(e){
            if(!isEditing()) return;                /* 非编辑模式：不接管，让翻转正常发生 */
            e.stopPropagation(); e.preventDefault();
            if(!front.querySelector('.flip-bg')){ pickBgImage(front, id); return; }
            /* 已有背景图 → 面板；面板已经开着就再点一次关掉（切换手感） */
            if(bgPop && bgPop.classList.contains('show') && bgTarget && bgTarget.front === front){
                bgPop.classList.remove('show'); bgTarget = null; return;
            }
            openBgPop(front, id, flip);
        });

        var rec = store.bg[id];
        if(rec && rec.src) applyBg(front, rec);
        syncBgHint(front);                          /* 遮罩文案：有图→「点击更换」，没图→「点击上传背景图」 */
    });
}

function openBgPop(front, id, flip){
    bgTarget = { front: front, id: id };
    var cur = (store.bg[id] && store.bg[id].opacity != null) ? store.bg[id].opacity : 0.55;
    bgRange.value = Math.round(cur * 100);
    bgVal.textContent = Math.round(cur * 100) + '%';
    bgPop.classList.add('show');
    positionPop(bgPop, flip.getBoundingClientRect());
}

function buildBgPop(){
    bgPop = document.createElement('div');
    bgPop.className = 'up-pop';
    bgPop.id = 'upBgPop';
    bgPop.innerHTML =
        '<button class="up-ib" data-b="pick" style="font-size:11.5px">上传背景图</button>' +
        '<span class="up-sep"></span>' +
        '<span class="up-lab">透明度</span>' +
        '<input type="range" min="0" max="100" step="1" id="upBgRange">' +
        '<span class="up-size" id="upBgVal">55%</span>' +
        '<span class="up-sep"></span>' +
        '<button class="up-ib" data-b="del" title="移除背景图">移除</button>' +
        '<button class="up-ib" data-b="close" title="关闭">\u2715</button>';
    document.body.appendChild(bgPop);
    bgRange = bgPop.querySelector('#upBgRange');
    bgVal   = bgPop.querySelector('#upBgVal');

    bgPop.addEventListener('mousedown', function(e){ e.preventDefault(); });

    bgPop.addEventListener('click', function(e){
        var b = e.target.closest('[data-b]');
        if(!b || !bgTarget) return;
        var act = b.dataset.b, front = bgTarget.front, id = bgTarget.id;
        if(act === 'pick'){
            pickBgImage(front, id);
        }
        if(act === 'del'){
            var img = front.querySelector('.flip-bg');
            if(img) img.remove();
            front.classList.remove('has-bg');
            syncBgHint(front);                 /* 移除后遮罩文案回到「点击上传背景图」 */
            delete store.bg[id];
            save();
        }
        if(act === 'close'){ bgPop.classList.remove('show'); bgTarget = null; }
        e.stopPropagation();
    });

    bgRange.addEventListener('input', function(){
        if(!bgTarget) return;
        var v = parseInt(bgRange.value, 10) / 100;
        var img = bgTarget.front.querySelector('.flip-bg');
        if(img) img.style.opacity = v;                 /* 实时改变 opacity */
        bgVal.textContent = bgRange.value + '%';
        var rec = store.bg[bgTarget.id];
        if(rec){ rec.opacity = v; debSave(); }
    });
}

/* ============================================================
   4b. 【需求4】视频放大播放 + 卡内视频自动播放管理
   · 卡内小屏：muted（静音）+ loop（循环）+ autoplay（自动播）→ 只有画面在动
   · 点击 → 大屏模态框播放，muted = false → 听到视频原本的声音
   ============================================================ */
var vmModal = null, vmVideo = null, vmCap = null;

function buildVideoModal(){
    vmModal = document.createElement('div');
    vmModal.className = 'vm-modal';
    vmModal.innerHTML =
        '<div class="vm-box">' +
          '<button class="vm-close" type="button" title="关闭（Esc）">\u2715</button>' +
          '<video id="vmVideo" controls playsinline webkit-playsinline preload="auto"></video>' +
          '<div class="vm-cap"><svg><use href="#i-video"/></svg><span id="vmCap"></span></div>' +
        '</div>';
    document.body.appendChild(vmModal);
    vmVideo = vmModal.querySelector('#vmVideo');
    vmCap   = vmModal.querySelector('#vmCap');
    vmModal.addEventListener('click', function(e){
        if(e.target === vmModal || e.target.closest('.vm-close')) closeVideoModal();
    });
}

/* 页面上所有「自动播放」的视频：首屏 hero.mp4 + 陕西广电的 morning / douyin */
function autoVideos(){
    return Array.prototype.slice.call(document.querySelectorAll('.avatar-video, .news-video, .phone-video'));
}

/* 只在视频进入视野时播放，切页 / 滚出视野自动暂停（省电，也不会几个视频一起响） */
function refreshVideos(){
    if(vmModal && vmModal.classList.contains('show')) return;   /* 放大播放中：小屏视频保持暂停 */
    autoVideos().forEach(function(v){
        var r = v.getBoundingClientRect();
        var on = r.width > 4 && r.height > 4 && r.bottom > -40 && r.top < window.innerHeight + 40;
        if(on){
            if(v.paused){ var p = v.play(); if(p && p.catch) p.catch(function(){}); }
        } else if(!v.paused){
            try { v.pause(); } catch(err){}
        }
    });
}

function setupVideoAutoplay(){
    /* 陕西广电两个视频：点一下 → 放大 + 开声音 */
    Array.prototype.forEach.call(document.querySelectorAll('video[data-zoom-video]'), function(v){
        v.addEventListener('click', function(e){
            e.stopPropagation();
            openVideoModal(v.getAttribute('src'), v.dataset.zoomVideo);
        });
    });
    window.addEventListener('scroll', refreshVideos, { passive:true });
    window.addEventListener('resize', refreshVideos, { passive:true });
    document.addEventListener('visibilitychange', refreshVideos);
    document.addEventListener('click', function(){ setTimeout(refreshVideos, 90); });  /* 切页后重新判断 */
    setTimeout(refreshVideos, 200);
}

function openVideoModal(src, label){
    if(!vmModal) buildVideoModal();
    vmCap.textContent = (label || '视频') + ' · 已开声音（Esc 或点空白处关闭）';
    /* 【注意】只在换了片源时才重新 setAttribute + load：
       反复清空 src 再赋值，在 file:// 下偶尔会让 <video> 进入「无可用片源」状态，
       保留已加载的片源、只把进度归零，反复开关也稳定 */
    if(vmVideo.getAttribute('src') !== src){
        vmVideo.setAttribute('src', src);
        try { vmVideo.load(); } catch(err){}
    }
    vmVideo.loop = true;
    vmVideo.muted = false;          /* 【需求4】放大后取消静音 → 听到原声 */
    vmVideo.volume = 1;
    try { vmVideo.currentTime = 0; } catch(err){}
    vmModal.classList.add('show');
    /* 小屏那两个视频先停住，避免同时出声 */
    autoVideos().forEach(function(v){ try { v.pause(); } catch(err){} });
    var p = vmVideo.play();
    if(p && p.catch) p.catch(function(){ /* 浏览器若仍拦截，点一下播放键即可（controls 已开） */ });
}

function closeVideoModal(){
    if(!vmModal) return;
    vmModal.classList.remove('show');
    try { vmVideo.pause(); } catch(err){}
    try { vmVideo.currentTime = 0; } catch(err){}
    refreshVideos();
}

        Array.prototype.forEach.call(document.querySelectorAll(s), function(el){ list.push(el); });
    });
    /* 兜底自动扫描：任何含「直接文本」的元素都可编辑（排除 svg / 编辑器自身 UI） */
    Array.prototype.forEach.call(document.querySelectorAll('body *'), function(el){
        if(el.closest('svg')) return;
        /* 排除：编辑器自身的控件、上传占位框内的提示文字、翻转卡右上角的「⇄」按钮 */
        if(el.closest('#upToast, .up-pop, .nav-edit-pill, .crop-modal, .vm-modal, .ph, .flip-btn, script, style, template')) return;
        for(var i = 0; i < el.childNodes.length; i++){
            var n = el.childNodes[i];
            if(n.nodeType === 3 && n.nodeValue.trim()){ list.push(el); break; }
        }
    });
    /* 去重 */
    list = list.filter(function(el, i){ return list.indexOf(el) === i; });
    /* 只保留最内层的元素：父元素不再重复注册，避免改动一处影响整体结构 */
    list = list.filter(function(el){
        return !list.some(function(o){ return o !== el && el.contains(o); });
    });
    return list;
}

function registerText(){
    texts = collectTextEls();
    texts.forEach(function(el){
        var id = ensureId(el);
        originals[id] = el.innerHTML;
        var restored = Object.prototype.hasOwnProperty.call(store.text, id);
        if(restored) el.innerHTML = store.text[id];
        if(store.size[id]) el.style.fontSize = store.size[id];
        /* 只有「被改过」的滚动数字才锁定终值；没改过的照旧走上场滚动动画 */
        if(restored && el.hasAttribute('data-count')){
            el.setAttribute('data-count', el.textContent);
            el.dataset.done = '1';
        }
        /* 昵称：只有用户真的改过（localStorage 有记录）才切成「已填写」样式，默认的「填写昵称」占位保持原样 */
        if(el.classList.contains('sph-nick')
           && restored
           && el.textContent.trim()) el.classList.add('filled');
    });
}

var perElTimer = {};
function scheduleSave(el){
    var id = el.dataset.editId;
    if(!id) return;
    clearTimeout(perElTimer[id]);
    perElTimer[id] = setTimeout(function(){
        store.text[id] = el.innerHTML;
        if(el.hasAttribute('data-count')) el.setAttribute('data-count', el.textContent);
        if(el.classList.contains('sph-nick')){
            if(el.textContent.trim()) el.classList.add('filled');
            else el.classList.remove('filled');
        }
        save();
    }, 420);
}

/* ---------- 字号工具条 ---------- */
var bar = null, curEl = null, sizeLabel = null;
function baseSize(el){
    var v = store.size[el.dataset.editId];
    if(v) return parseFloat(v);
    var c = parseFloat(getComputedStyle(el).fontSize);
    return isNaN(c) ? 14 : c;
}
function applySize(el, px){
    px = Math.max(8, Math.min(96, Math.round(px)));
    el.style.fontSize = px + 'px';
    store.size[el.dataset.editId] = px + 'px';
    if(sizeLabel) sizeLabel.textContent = px + 'px';
    save();
}
function positionPop(pop, r){
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = r.left + r.width / 2 - pw / 2;
    var top  = r.top - ph - 10;
    if(top < 8) top = Math.min(window.innerHeight - ph - 8, r.bottom + 10);
    left = Math.max(8, Math.min(window.innerWidth - pw - 8, left));
    pop.style.left = left + 'px';
    pop.style.top  = top + 'px';
}
function showTextBar(el){
    curEl = el;
    bar.classList.add('show');
    sizeLabel.textContent = Math.round(baseSize(el)) + 'px';
    positionPop(bar, el.getBoundingClientRect());
}
function hideTextBar(){ if(bar) bar.classList.remove('show'); curEl = null; }

function buildBar(){
    bar = document.createElement('div');
    bar.className = 'up-pop';
    bar.id = 'upTextBar';
    bar.innerHTML =
        '<button class="up-ib" data-act="minus" title="缩小字号">A-</button>' +
        '<span class="up-size" id="upSize">14px</span>' +
        '<button class="up-ib" data-act="plus" title="放大字号">A+</button>' +
        '<span class="up-sep"></span>' +
        '<button class="up-ib" data-act="reset" style="font-size:11.5px" title="恢复这一处的默认文字与字号">还原</button>' +
        '<button class="up-ib" data-act="close" title="关闭">\u2715</button>';
    document.body.appendChild(bar);
    sizeLabel = bar.querySelector('#upSize');
    bar.addEventListener('mousedown', function(e){ e.preventDefault(); });
    bar.addEventListener('click', function(e){
        var b = e.target.closest('[data-act]');
        if(!b || !curEl) return;
        var a = b.dataset.act;
        if(a === 'minus') applySize(curEl, baseSize(curEl) - 1);
        if(a === 'plus')  applySize(curEl, baseSize(curEl) + 1);
        if(a === 'reset'){
            var id = curEl.dataset.editId;
            curEl.innerHTML = originals[id];
            curEl.style.fontSize = '';
            delete store.text[id];
            delete store.size[id];
            if(curEl.hasAttribute('data-count')) curEl.setAttribute('data-count', curEl.textContent);
            if(curEl.classList.contains('sph-nick')) curEl.classList.remove('filled');
            save();
            sizeLabel.textContent = Math.round(parseFloat(getComputedStyle(curEl).fontSize) || 14) + 'px';
        }
        if(a === 'close') hideTextBar();
        e.stopPropagation();
    });
}

function setEdit(on){
    editOn = on;
    document.body.classList.toggle('edit-on', on);
    texts.forEach(function(el){
        if(on){ el.setAttribute('contenteditable', 'true'); el.setAttribute('spellcheck', 'false'); }
        else { el.removeAttribute('contenteditable'); try{ el.blur(); }catch(e){} }
    });
    hideTextBar();
    if(!on && bgPop) bgPop.classList.remove('show');
    var btn = pillEdit;      /* 【需求1】右下角按钮已移除，状态改由导航胶囊里的「编辑」按钮反馈 */
    if(btn){
        btn.classList.toggle('on', on);
    }
    if(on) toast('已进入编辑模式：点任意文字即可修改（选中后有 A- / A+ 工具条）；按 Esc 或再点一次「编辑」退出');
}

/* ============================================================
   6. 【需求1】顶部导航编辑胶囊（替代原来右下角那三个按钮）
   · 右下角的「编辑模式 / 使用说明 / 清除本地数据」已彻底删除，
     默认状态下页面右下角空无一物（HTML 也一并删掉了，不是隐藏）。
   · 按 Ctrl + Shift + E（Mac：Cmd + Shift + E）唤出 / 隐藏胶囊。
   · 胶囊是 .nav 的直接子元素 → 位置就在「联系我」右侧，
     且与「技能图谱 ↔ 联系我」共用同一个 --nav-gap，间距绝对统一。
   · 高度 / 圆角 / 边框 / 半透明底色 / 字号 / 字重 / 颜色 全部对齐 .nav-pill。
   · 需要清空本地数据时（原「清除本地数据」按钮的功能）：
     浏览器控制台执行 localStorage.removeItem('LLJ_PORTFOLIO_EDIT_V1'); location.reload();
   ============================================================ */
var pill = null, pillEdit = null;

function buildNavPill(){
    var nav = document.getElementById('nav');
    if(!nav) return;
    pill = document.createElement('div');
    pill.className = 'nav-edit-pill';
    pill.id = 'navEditPill';
    pill.innerHTML =
        '<button class="pill-btn" id="pillEdit" type="button" title="进入 / 退出编辑模式（按 Ctrl / Cmd + Shift + E 可收起整条）">编辑</button>' +
        '<span class="pill-sep"></span>' +
        '<button class="pill-btn" id="pillSave" type="button" title="保存并收起胶囊">保存</button>';
    nav.appendChild(pill);          /* 追加在「联系我」之后 → 间距自动等于导航栏的 gap */
    pillEdit = pill.querySelector('#pillEdit');

    /* 编辑：默认灰色（未激活），悬浮 / 激活（编辑中）变亮 */
    pillEdit.addEventListener('click', function(){ setEdit(!editOn); });

    /* 保存：弹「已保存！」→ 整条胶囊自动隐藏 */
    pill.querySelector('#pillSave').addEventListener('click', function(){
        if(save()) toast('已保存！');   /* 平时是边改边存，这里再强制落一次盘做双保险 */
        setEdit(false);
        pill.classList.remove('show');
    });
}

/* 唤出 / 隐藏胶囊（快捷键与保存按钮共用） */
function togglePill(force){
    if(!pill) return;
    var show = (typeof force === 'boolean') ? force : !pill.classList.contains('show');
    pill.classList.toggle('show', show);
}

/* ============================================================
   7. 事件绑定
   ============================================================ */
function bindEditor(){
    /* 输入 → 保存 */
    document.addEventListener('input', function(e){
        var el = e.target;
        if(el && el.hasAttribute && el.hasAttribute('data-edit-id')) scheduleSave(el);
    }, true);

    /* 纯文本粘贴，避免把外部样式带进来 */
    document.addEventListener('paste', function(e){
        var el = e.target;
        if(editOn && el && el.hasAttribute && el.hasAttribute('data-edit-id')){
            e.preventDefault();
            var t = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, t);
        }
    }, true);

    /* 编辑模式下屏蔽跳转 / 翻转 / 证书弹层，避免「点文字就跳页」 */
    document.addEventListener('click', function(e){
        if(!editOn) return;
        /* 编辑器自身的控件永远放行 */
        if(e.target.closest('.nav-edit-pill, .up-pop, .crop-modal, .vm-modal')) return;
        if(e.target.closest('[data-goto], .flip, .skill-item, [data-cert], [data-cert-close], [data-cert-overlay]')){
            /* 【需求2】市场调研卡的正面（.up-flip-front）要留给「上传 / 更换背景图」，
               不能被这里拦掉，否则点击文字区域时背景图入口失效 */
            if(e.target.closest('[data-edit-id]') && !e.target.closest('.up-flip-front')){
                e.stopPropagation(); e.preventDefault();
            }
        }
    }, true);

    /* 选中某一处文字 → 浮出工具条 */
    document.addEventListener('mousedown', function(e){
        if(!editOn) return;
        var el = e.target.closest ? e.target.closest('[data-edit-id]') : null;
        if(el){
            setTimeout(function(){ showTextBar(el); }, 0);
        } else if(!e.target.closest('#upTextBar, #upBgPop, .nav-edit-pill, .crop-modal, .vm-modal, .up-flip-front')){
            hideTextBar();
            if(bgPop) bgPop.classList.remove('show');
        }
    });

    document.addEventListener('keydown', function(e){
        /* 【需求1】Ctrl + Shift + E（Mac：Cmd + Shift + E）→ 唤出 / 隐藏编辑胶囊 */
        if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.code === 'KeyE' || e.key === 'E' || e.key === 'e')){
            e.preventDefault();
            togglePill();
            return;
        }
        if(e.key !== 'Escape') return;
        /* 裁剪弹窗 / 视频弹窗 优先吃掉 Esc（先关弹窗，不退出编辑模式） */
        if(cropModal && cropModal.classList.contains('show')){ closeCropper(); return; }
        if(vmModal && vmModal.classList.contains('show')){ closeVideoModal(); return; }
        setEdit(false);
        if(bgPop) bgPop.classList.remove('show');
    });

    /* ---------- 【本轮要求3】修复「<button> 类可编辑元素打不出空格」 ----------
       根因（与上面的 white-space 折叠问题是两回事，两者都必须修）：
         skill-item / nav-pill / back-home / entry 这些「技能标签、导航胶囊、返回首页」
         本身就是 <button>。在 <button> 上按 Space，浏览器把它当成「激活按钮」的默认行为
         → 按钮点击被触发（编辑模式下又被上面第 4229 行拦掉），而 contenteditable 的
         「插入空格」默认行为则被完全吞掉 —— 所以字母、汉字都能打，唯独空格打不出来。
       解法：编辑模式下在捕获阶段先拦下 Space，阻止按钮激活，再手动插入一个空格。
         · 只对 BUTTON 生效：<b>/<span>/<div> 等元素本来就正常，不动它们
         · 用 execCommand 插入 → 会正常派发 input 事件 → 复用已有的「输入即保存」链路 */
    document.addEventListener('keydown', function(e){
        if(!editOn) return;
        if(e.key !== ' ' && e.key !== 'Spacebar') return;
        var el = e.target;
        if(!el || !el.tagName || el.tagName !== 'BUTTON') return;
        if(!el.isContentEditable || !el.hasAttribute('data-edit-id')) return;
        e.preventDefault();   /* 阻止 <button> 的 Space 激活（否则会触发点击 / 不插入字符） */
        if(document.execCommand('insertText', false, ' ')) return;
        /* 兜底：execCommand 不可用时手动插入，并补派发 input 以触发保存 */
        var sel = window.getSelection();
        if(!sel || !sel.rangeCount) return;
        var rg = sel.getRangeAt(0);
        rg.deleteContents();
        var tn = document.createTextNode(' ');
        rg.insertNode(tn);
        rg.setStartAfter(tn); rg.collapse(true);
        sel.removeAllRanges(); sel.addRange(rg);
        el.dispatchEvent(new Event('input', { bubbles: true }));
    }, true);
    window.addEventListener('resize', function(){ hideTextBar(); if(bgPop) bgPop.classList.remove('show'); });
    window.addEventListener('scroll', function(){
        if(curEl && bar && bar.classList.contains('show')) positionPop(bar, curEl.getBoundingClientRect());
    }, true);
}

/* ============================================================
   7b. 【需求1】翻转卡：编辑模式专用的「⇄ 翻转」按钮
   · 每张 .flip 卡片右上角塞一枚小圆按钮（span，不是 button —— 外层 .flip 已是 <button>）
   · 只在编辑模式显示（CSS: body.edit-on .flip-btn{display:flex}）
   · 点击 → 切换 .on（走同一套 rotateY 过渡动画，动效与直接点卡片完全一致），
     并 stopPropagation 掉，避免同时触发 .flip 自身的点击逻辑（否则会翻两次 = 原地不动）
   · 手动翻转不设自动回弹计时器 → 翻到背面就停住，方便慢慢改字
   ============================================================ */
function buildFlipButtons(){
    $$('.flip').forEach(function(f){
        if(f.querySelector('.flip-btn')) return;
        var b = document.createElement('span');
        b.className = 'flip-btn';
        b.setAttribute('role', 'button');
        b.setAttribute('aria-label', '翻转卡片');
        b.setAttribute('title', '翻到背面 / 翻回正面（编辑模式专用）');
        b.textContent = '\u21C4';            /* ⇄ */
        /* mousedown / click 都拦住：防止落到 .flip 的翻转逻辑上、也防止把正在编辑的光标顶掉 */
        b.addEventListener('mousedown', function(e){ e.stopPropagation(); });
        b.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            clearTimeout(f._flipTimer);      /* 手动翻转 → 不自动回弹 */
            f.classList.toggle('on');
        });
        f.appendChild(b);
    });
}

/* ============================================================
   8. 启动
   ============================================================ */
/* 先给所有翻转卡的面套一层 .flip-txt（把文字和将来插入的背景图层分层），
   再注册文字 —— 顺序不能反，否则 id 计算会错位 */
Array.prototype.forEach.call(document.querySelectorAll('.flip-face'), function(f){
    if(f.querySelector('.flip-txt')) return;
    var t = document.createElement('span');
    t.className = 'flip-txt';
    while(f.firstChild) t.appendChild(f.firstChild);
    f.appendChild(t);
});

setupMediaSlots();
setupBgSlots();
registerText();
buildBar();
buildBgPop();
buildNavPill();        /* 【需求1】导航栏里的编辑胶囊（默认隐藏，Ctrl / Cmd + Shift + E 唤出） */
buildFlipButtons();    /* 【需求1】翻转卡右上角的「⇄」按钮（仅编辑模式可见） */
buildVideoModal();     /* 【需求4】视频放大弹窗（取消静音听原声） */
setupVideoAutoplay();  /* 【需求4】卡内视频：可见才播、点击放大出声 */
bindEditor();

})();
</script>
