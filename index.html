f<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>李琳洁 · 项目管理 | 数据洞察 | AI 探索者</title>

<!-- ===== 动画库（CDN）：GSAP 主驱动 + Animate.css 备用，加载失败自动降级为纯 CSS 动效 ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" onerror="this.remove()" />

<style>
/* ============================================================
   0. 设计令牌 —— 明亮 / 青春 / 呼吸感
   底色：晴空蓝；撞色：亮黄 / 活力橙 / 明亮粉
   ============================================================ */
:root{
  --blue:#1B84F0;          /* 主色：明亮天蓝 */
  --blue-d:#0A63C9;
  --royal:#3B7BFF;         /* 轻快宝蓝 */
  --sky:#4CC2F7;
  --sky-l:#A9E2FF;
  --sky-pale:#EAF7FF;
  --yellow:#FFD24D;
  --orange:#FF9A3D;
  --pink:#FF7CB6;
  --lime:#7FD86A;
  --violet:#8B7CFF;

  --ink:#0F3556;           /* 正文深蓝灰，不用纯黑 */
  --ink-2:#5D84A6;
  --ink-3:#A2BACE;

  --card:#FFFFFF;
  --line:rgba(43,140,214,.12);

  --r-xl:30px; --r-lg:24px; --r-md:16px; --r-sm:10px;

  --sh:0 10px 30px rgba(23,116,196,.10);
  --sh-h:0 20px 48px rgba(23,116,196,.20);

  /* ---- 全局排版基准（铁律变量，改一处即全站统一） ---- */
  --gap:22px;              /* h：卡片与卡片之间的行 / 列间距 */
  --card-h:326px;          /* H：卡片基准高度（以「亨通线缆」两张卡为准） */
  --card-padding:24px;     /* 卡片内边距：顶部 / 图标下方 / 底部 三处数值完全相等 */
  --section-gap:46px;      /* v：节点与节点之间的垂直间距 */
  --skill-gap:32px;        /* s：技能图谱卡片之间（横竖相等） */

  --max:1160px;
  /* 【需求1】导航栏统一间距与统一高度：
     · 导航按钮之间、「联系我」与编辑胶囊之间 共用 --nav-gap
     · 「联系我」与胶囊条共用 --nav-h（实测导航按钮高度 36px） */
  --nav-gap:8px;
  --nav-h:36px;

  /* ---- 【需求2】首屏形象视频（hero.mp4）背景融合 ----
     ★★ 融合模式总开关：只改下面这一个值即可 ★★
       multiply → 正片叠底：视频背景是「白色 / 浅色」时用，白色被页面底色吃掉，只剩人物
       screen   → 滤色    ：视频背景是「黑色 / 深色」时用，黑色消失
       lighten / normal / darken / soft-light → 其它背景色的备选（可随意试）
     实测 hero.mp4（无 alpha 通道的普通视频）的底：
       · 是一层「浅灰白照片底」（不是纯白）：均值 RGB(236,235,234)，亮度范围约 190~246，
         左下角最暗（站在地面的接触阴影），右下角偏暗并压着「豆包AI生成」水印。
       · 单靠 multiply 会留下一个比页面暗 10~50 的淡色方块 → 所以配两件事：
         ① --video-filter 把那层浅灰整体提到纯白（见下方 #heroExp 滤镜）；
         ② 再用 mask 把「右下角最暗的那一小块（含水印）」直接挖掉（见 .avatar-video 里
            --wm-cut-* 三个变量）→ 方块边界彻底消失。 */
  --video-blend-mode:multiply;
  /* 视频在容器里的填充方式：contain = 完整显示不裁剪（可能留边）；cover = 铺满但可能裁边 */
  --video-object-fit:contain;

  /* ---- 【需求6】首屏视频的「去残留 + 提亮」滤镜（id = heroExp，定义在页面里的 SVG <defs> 中）----
     为什么不能只写 filter:brightness()？
       · 视频底不是纯白，而是一层「浅灰白照片底」（本次 hero.mp4 实测均值 RGB 236/235/234，
         最暗处 190 左右），单纯压暗只会把底色压得比页面还暗 → 露出一个明显方框；
       · 主体暗部偏死黑（头发 p01≈0.02），边缘还有压缩彩边。
     heroExp 是一条三步管线（顺序不能换）：
       ① table 曲线：把黑点抬到 0.05（暗部不再死黑），并把 0.85 以上迅速收敛到 1.0
                     → 「背景那一档浅灰」被整段推到纯白，而人物（亮部到 0.8 出头）几乎不受影响
       ② saturate 0.85：压掉底的灰调与人物剪影边缘的彩色描边
       ③ 逐通道 linear 白平衡（必须放最后 → 背景一定被夹到纯白）
     实测（本次 hero.mp4）：视频四周与页面底色的亮度差 ≤2/255（肉眼不可见），
     人物区域完全不受影响；下半个画面里最暗的那一小块（含水印）由 mask 单独挖掉（见 .avatar-video）。
     ★ 想更暗 / 更亮：改 SVG 里第 ① 步 tableValues（保持最后一个值 = 1 即可）
     ★ 完全不想用 SVG 滤镜时，可换成纯 CSS 备用方案（兼容性最好，但去灰调能力弱很多）：
           --video-filter:brightness(1.07) contrast(1.02) saturate(0.9);                 */
  --video-filter:url(#heroExp);

  /* 【需求2】视频的上下留白（相对 .avatar-stage 计算，只动上下、绝不动左右）：
       top    = 33px → 视频顶边 = 左侧姓名「李琳洁」大字的顶端
       bottom = 22px → 视频底边 = 「技能图谱 / 联系我」两张卡的底端
     宽度由 object-fit:contain 按原比例自动算出 → 永远是 3:4 等比缩放，绝不拉伸变形 */
  --video-top:-20px;
  --video-bottom:-9px;

  /* 视频透明度（1 = 不透明）：万一背景颜色太杂，压到 .9 左右也能明显减弱 */
  --video-opacity:1;

  /* ---- 【本轮需求3】人像大小 / 垂直位置：让新视频里的人像与原来「看起来一样大、一样高」----
     ★ 换了素材一定要重算这两个数，方法如下（下面的数字都是这样量出来的，不是估的）。

     第一步：量出「人像高度 ÷ 画面高度」——用抽帧 + 逐行轮廓统计得到：
       · 上一版 hero_new（3:4，2160×2916）：头顶 2.0%、脚底 98.1% → 人像高 96.0% 画面高
       · 本次 hero.mp4（9:16，720×1280）：头顶 1.0%、脚底 98.0% → 人像高 96.9% 画面高

     第二步：算出视频在容器里「实际被显示多高」——容器 .avatar-video 是 392×537，
     object-fit:contain 会按原比例内接，所以显示高度 D = min(537, 392 ÷ 视频宽高比)：
       · 上一版 2160/2916 = 0.7407 → 392÷0.7407 = 529.3 < 537 → D = 529.3（左右顶满，上下各留 3.9px）
       · 本次   720/1280  = 0.5625 → 392÷0.5625 = 696.9 > 537 → D = 537  （上下顶满，左右各留 45px）
     ★ 注意：换素材时 D 一般会变（本次就变了），所以不能只比「人像占画面的百分比」。

     第三步：让两者的「屏幕上人像高度」相等 —— 屏幕上人像高 = D × 人像占比 × scale：
       · 上一版：529.3 × 0.960 × 0.853 = 433.4 px  ← 这就是要还原的目标
       · 本次  ：537  × 0.969 × scale  = 433.4 px → 解出 scale = 0.833
     ★★ 想再大一点 / 小一点：只改 --video-scale 这一个数（1 = 不缩放，0.833 = 缩到 83.3%）

     ★ 缩放中心 --video-origin-y：「竖直方向上不动的那条线」，相对视频框（392×537）按百分比算。
       取值同样是反算的，不是拍脑袋的一半 —— 要求「缩放后脚底刚好停在上一版的高度」（y=647.6）：
         508.5... 解出 origin-y = 62.9%
       → 这样缩放后，人像的「大小」和「上下位置」与上一版同时一致（实测头顶 214.0、脚底 647.6，
         上一版是 214.1 / 647.6），不需要额外 translate。
     ★ 想只改大小、不动上下位置，把 --video-origin-y 改成 50%（以视频框中心缩放）即可。 */
  --video-scale:0.833;
  --video-origin-y:62.9%;

  /* ---- 【需求1】首屏四张入口卡的整体上移量 ----
     （以前写在 .hero-entries 里面；为了让右侧三枚悬浮标签也能引用，已上移到 :root）
       --entry-lift-top    ：上面一行（我的经历 / 独立项目）整体上移多少
       --entry-lift-bottom ：下面一行（技能图谱 / 联系我）整体上移多少
     ★ 右侧「Data」标签贴的就是下面一行的底边、「AI」标签贴的是两行的缝隙中点，
       所以改这两个值，右上角两枚标签会自动跟着挪，不用再手动对位。 */
  --entry-lift-top:12px;
  --entry-lift-bottom:36px;

  /* ---- 页面底色（body 用）---- */
  --page-bg:
    radial-gradient(1200px 620px at 12% -6%, #DCF1FF 0%, rgba(220,241,255,0) 62%),
    radial-gradient(1000px 560px at 92% 4%, #FFF1D6 0%, rgba(255,241,214,0) 60%),
    radial-gradient(900px 600px at 78% 96%, #FFE7F3 0%, rgba(255,231,243,0) 62%),
    linear-gradient(180deg,#F1FAFF 0%,#F8FCFF 46%,#FFFAF1 100%);
}

*,*::before,*::after{ box-sizing:border-box; }

html{ scroll-behavior:smooth; }

body{
  margin:0;
  font-family:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--page-bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* 漂浮光斑 */
.blobs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.blob{ position:absolute; border-radius:50%; filter:blur(46px); opacity:.5; }
.blob.b1{ width:340px;height:340px; background:#9FDCFF; top:-90px; left:-70px; animation:drift1 18s ease-in-out infinite; }
.blob.b2{ width:280px;height:280px; background:#FFE08A; top:34%; right:-90px; animation:drift2 22s ease-in-out infinite; }
.blob.b3{ width:300px;height:300px; background:#FFC0DD; bottom:-110px; left:26%; animation:drift3 26s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,50px)} }
@keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-70px,60px)} }
@keyframes drift3{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,-60px)} }

/* ============================================================
   1. 顶栏 + 导航
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:60;
  backdrop-filter:blur(14px);
  background:rgba(250,253,255,.78);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:var(--max); margin:0 auto; padding:12px 24px;
  display:flex; align-items:center; gap:18px;
}
.brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.4px; cursor:pointer; }
/* 蓝底白字标签：拉长到刚好装下「李琳洁」三个字 */
.brand-tag{
  display:inline-flex; align-items:center; justify-content:center;
  padding:8px 16px; border-radius:11px;
  background:linear-gradient(135deg,var(--sky),var(--blue) 58%,var(--royal));
  color:#fff; font-size:14.5px; font-weight:900; letter-spacing:1.5px;
  box-shadow:0 6px 16px rgba(27,132,240,.34);
}
.brand-sub{ font-size:11px; color:var(--ink-3); font-weight:600; letter-spacing:.2px; }

.nav{ margin-left:auto; display:flex; gap:var(--nav-gap); overflow-x:auto; scrollbar-width:none; }
.nav::-webkit-scrollbar{ display:none; }
.nav-pill{
  flex:0 0 auto;
  min-height:var(--nav-h);          /* 【需求1】高度与编辑胶囊共用同一个变量，绝不会一高一矮 */
  border:1px solid var(--line);
  background:#fff; color:var(--ink-2);
  font:inherit; font-size:13px; font-weight:700;
  padding:8px 16px; border-radius:999px; cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:.28s cubic-bezier(.22,.8,.3,1);
  white-space:nowrap;
}
.nav-pill svg{ width:15px;height:15px; }
.nav-pill:hover{ transform:translateY(-2px); box-shadow:var(--sh); color:var(--blue); border-color:rgba(27,132,240,.3); }
.nav-pill.on{
  background:linear-gradient(135deg,var(--sky),var(--blue));
  color:#fff; border-color:transparent;
  box-shadow:0 8px 22px rgba(27,132,240,.34);
}

/* ============================================================
   1b. 编辑胶囊条（【需求1】右下角按钮的替代品）
   · 默认不显示，按 Ctrl + Shift + E（Mac：Cmd + Shift + E）唤出 / 隐藏
   · 它是 .nav 的直接子元素 → 与「技能图谱」「联系我」共用同一个 --nav-gap，
     「联系我 ↔ 胶囊条」的水平间距 = 「技能图谱 ↔ 联系我」的水平间距，绝对统一
   · 高度 / 圆角 / 边框 / 字号 / 字重 / 颜色 全部对齐 .nav-pill（即「联系我」按钮）
   ============================================================ */
.nav-edit-pill{
  flex:0 0 auto; display:none; align-items:center;
  height:var(--nav-h);              /* = 「联系我」导航按钮的实际高度 */
  padding:0 6px; border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.72); /* 半透明，和顶栏的磨砂感一致 */
  backdrop-filter:blur(14px);
  box-shadow:var(--sh);
}
.nav-edit-pill.show{ display:inline-flex; animation:pillIn .24s cubic-bezier(.22,.8,.3,1); }
@keyframes pillIn{ from{ opacity:0; transform:translateX(-6px);} to{ opacity:1; transform:none;} }
/* 胶囊内的两个小按钮：字体 / 字号 / 字重 / 颜色 与「联系我」导航按钮完全一致 */
.pill-btn{
  font:inherit; font-size:13px; font-weight:700; line-height:1;
  color:var(--ink-2);               /* = .nav-pill 的文字颜色 */
  background:transparent; border:none; cursor:pointer;
  padding:7px 11px; border-radius:999px; white-space:nowrap;
  opacity:.6;                        /* 默认灰（未激活） */
  transition:.24s cubic-bezier(.22,.8,.3,1);
}
.pill-btn:hover{ opacity:1; color:var(--blue); background:rgba(27,132,240,.1); }   /* 悬浮变亮 */
.pill-btn.on{                        /* 激活（编辑进行中）：与 .nav-pill.on 同一套配色 */
  opacity:1; color:#fff; background:linear-gradient(135deg,var(--sky),var(--blue));
  box-shadow:0 6px 16px rgba(27,132,240,.32);
}
/* 中间分隔：小竖线 */
.pill-sep{ flex:0 0 auto; width:1px; height:16px; margin:0 2px; background:var(--line); }

/* ============================================================
   2. 视图容器
   ============================================================ */
/* 【需求2】main 去掉了原来的 z-index:1：
   z-index 会让 main 变成一个「隔离层」，首屏视频的 mix-blend-mode 就只能和
   main 内部（一片透明）混合，永远融不进页面底色。去掉之后 main 依然排在
   .blobs（光斑，z-index:0）之后绘制，层级关系与视觉完全不变。 */
main{ position:relative; max-width:var(--max); margin:0 auto; padding:0 24px 80px; }
.view{ display:none; }
.view.active{ display:block; }

/* 入场：由 IntersectionObserver 逐张点亮 */
[data-anim]{
  opacity:0; transform:translateY(20px) scale(.985);
  transition:opacity .62s cubic-bezier(.22,.8,.3,1), transform .62s cubic-bezier(.22,.8,.3,1);
  transition-delay:var(--d,0ms);
}
[data-anim].is-in{ opacity:1; transform:none; }

/* 各区块标题 */
/* 四个入口页共用同一套标题骨架：位置 / 字号 / 字重 / 颜色 / 与首行内容间距全部一致 */
.view-head{ display:flex; align-items:flex-end; gap:26px; padding:46px 0 40px; min-height:70px; }
.view-title{ font-size:30px; font-weight:900; letter-spacing:-.4px; margin:0; color:var(--ink); }
.view-title em{ font-style:normal; color:var(--blue); }
.view-desc{ font-size:13px; color:var(--ink-2); font-weight:600; padding-bottom:7px; }
.back-home{
  margin-left:auto; border:1px solid var(--line); background:#fff;
  font:inherit; font-size:12.5px; font-weight:700; color:var(--ink-2);
  padding:8px 15px; border-radius:999px; cursor:pointer;
  display:flex; align-items:center; gap:6px; transition:.25s;
}
.back-home:hover{ color:var(--blue); border-color:rgba(27,132,240,.34); transform:translateX(-2px); }
.back-home svg{ width:14px;height:14px; }

/* ============================================================
   3. 首屏
   ============================================================ */
/* 首屏左右两栏绝对等高、顶部与底部完全对齐（grid stretch 强制齐平）
   左栏：顶部信息块收紧，四个入口卡拉伸填满剩余高度（保持长方形，行高等分）
   右栏：高度严格绑定左栏总高，形象卡被压成接近方形，不再瘦高 */
/* 【要求1】首屏整体下移：顶部内边距 28 → 76px，让首屏内容离开浏览器顶端
   min-height 同步上抬（540→600），并把 100vh 的扣减值由 300 调到 252
   → 矮屏下内容可用高度与改动前完全一致，高屏下才多出呼吸空间 */
.hero{ padding:76px 0 24px; min-height:min(636px, calc(100vh - 252px)); display:grid; grid-template-columns:1.15fr .85fr; gap:36px; align-items:stretch; }
.hero-left{ display:flex; flex-direction:column; min-width:0; }
.hero-tagline{
  display:inline-flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--blue);
  box-shadow:var(--sh); align-self:flex-start;
}
.hero-tagline .pulse{ width:8px;height:8px;border-radius:50%;background:var(--lime); animation:pulse 1.8s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.55);opacity:.5} }

.hero-name{
  font-size:clamp(48px,7.4vw,82px); font-weight:900; letter-spacing:-2px;
  margin:14px 0 4px; line-height:1;
  background:linear-gradient(120deg,var(--blue-d),var(--blue) 34%,var(--sky) 62%,var(--royal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-roles{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:12px 0 0; }
.role{
  font-size:13.5px; font-weight:800; padding:7px 14px; border-radius:999px;
  background:#fff; border:1px solid var(--line); box-shadow:var(--sh);
}
.role:nth-child(1){ color:var(--blue); }
.role:nth-child(3){ color:var(--orange); }
.role:nth-child(5){ color:var(--pink); }
.role-sep{ color:var(--ink-3); font-weight:900; }

/* 入口卡：紧贴标签行（只留 20px），自身拉伸填满左栏剩余空间 → 卡片间距自然拉大、仍是长方形 */
/* 【需求3】四张入口卡改版：
   · 卡片本身变矮 —— 行高由 --entry-h 锁死（原来是 1fr，会被拉满整块区域）
   · 左侧区域总高度不变 —— 容器仍然 flex:1，撑满首屏左栏剩余高度，一块不多一块不少
   · 省下来的空间全部变成「间距」—— align-content:space-between 让上下两行分贴区域的
     上沿 / 下沿，中间多出来的高度全部转成行间距；横向间距由 --entry-gap 加大
   · 对齐不受影响 —— 仍是 2×2 网格，两列等宽、两行等高，永远横平竖直
   ★ 想继续微调：改下面两个变量即可（--entry-h 越小 → 卡片越矮、间距越大） */
.hero-entries{
  --entry-h:36%;        /* 每张卡高度 = 左侧卡片区总高度的 36% */
  --entry-gap:22px;     /* 卡片之间的最小间距（横向就是它，纵向的多余空间自动均分） */
  /* 【需求1】上下两组卡片各自整体上移的量（只挪位置，卡片尺寸/圆角/颜色一律不动）
     · 上面一组（我的经历 / 独立项目）：上移 12px → 微调
     · 下面一组（技能图谱 / 联系我）  ：上移 36px → 一大截
     ★ 效果：整块卡片整体上提，两行更紧凑
     ★ 想继续微调：只改这两个值即可，改大 = 上移更多
     ★★ 注意：这两个变量已经「搬迁」到文件开头的 :root 里了（右侧悬浮标签也要引用它们，
        而标签不在 .hero-entries 内部、拿不到这里的局部变量）。在这里改是无效的，
        请去 :root 改 —— 见「--entry-lift-top / --entry-lift-bottom」那一段。 */
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:max(76px, var(--entry-h));   /* 高度按区域比例缩放，但绝不低于 76px（矮屏防压扁） */
  gap:var(--entry-gap);
  align-content:space-between;
  margin-top:56px; padding-top:0; max-width:520px; flex:1; min-height:0;
}
/* 【需求1】用 position:relative + top 做「纯位移」：
   这样只改变卡片的绘制位置，不会像 margin-top 那样把卡片本身拉高变胖
   （.entry 已是 position:relative，且 hover 动效走的是 transform，两者互不打架） */
.hero-entries .entry:nth-child(-n+2){ top:calc(-1 * var(--entry-lift-top)); }
.hero-entries .entry:nth-child(n+3){ top:calc(-1 * var(--entry-lift-bottom)); }
.entry{
  border:1px solid var(--line); background:#fff; border-radius:var(--r-lg);
  padding:13px 15px; cursor:pointer; text-align:left; font:inherit;
  display:flex; align-items:center; gap:14px;
  box-shadow:var(--sh); transition:.32s cubic-bezier(.22,.8,.3,1); position:relative; overflow:hidden;
}
.entry::after{
  content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
  background:linear-gradient(180deg,var(--sky),var(--blue)); transform:translateX(-6px); transition:.32s;
}
.entry:hover{ transform:translateY(-5px); box-shadow:var(--sh-h); border-color:rgba(27,132,240,.28); }
.entry:hover::after{ transform:none; }
.entry-ico{
  width:44px;height:44px;border-radius:14px; flex:0 0 auto;
  display:grid;place-items:center; color:#fff;
}
.entry-ico svg{ width:22px;height:22px; }
.e1 .entry-ico{ background:linear-gradient(135deg,var(--sky),var(--blue)); }
.e2 .entry-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); }
.e3 .entry-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); }
.e4 .entry-ico{ background:linear-gradient(135deg,var(--lime),#3FBBA0); }
.entry-txt b{ display:block; font-size:15px; font-weight:800; letter-spacing:.2px; }
.entry-txt span{ display:block; font-size:11.5px; color:var(--ink-3); font-weight:600; margin-top:2px; }
.entry-arrow{ margin-left:auto; color:var(--ink-3); transition:.3s; }
.entry:hover .entry-arrow{ color:var(--blue); transform:translateX(4px); }
.entry-arrow svg{ width:16px;height:16px; display:block; }

/* 头像占位：整体尺寸缩小、高度直接压扁成接近方形；高度 100% 绑定左栏总高，上下边缘与左栏齐平 */
/* 【要求7】右栏改为「垂直+水平双向居中」：3D 形象卡在右栏里居中收拢，减少上下空白 */
.hero-visual{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px; }
.avatar-wrap{ position:relative; width:min(100%,420px); max-height:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; min-height:0; }
/* 【新阶段要求4】去掉背景：光环(.avatar-ring)、白卡底/描边/投影、舞台渐变全部移除，
   3D 人物直接悬浮在页面背景上；布局尺寸（padding/flex）原样保留 → 初始位置与大小不变 */
.avatar-card{
  position:relative; padding:14px; flex:1; display:flex; min-height:0;
}
@keyframes spin{ to{ transform:rotate(360deg); } }   /* 「联系我」光晕仍在使用 */
@keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
/* 【需求2】形象舞台：原来是 Three.js 画布容器，现在装首屏视频（hero.mp4）
   · 容器尺寸 / 位置 / 圆角一行未改 → 与原 3D 形象所占的位置、大小完全重合
   · 视频绝对定位铺满，不参与撑高（首屏「左右等高」铁律不受影响）
   · 这里「故意」不写 background、也不写 isolation：
     mix-blend-mode 必须与真正的页面底色（body 的固定渐变 + 光斑）发生混合。
     中间任何一层祖先只要带 transform / isolation / z-index，都会把背板切断，
     结果就是一个突兀的浅色方块。为此做了三处配套：
       ① main 去掉了 z-index:1（见 2 节注释）
       ② 首屏 GSAP 不再给 .hero-visual 留 transform（见 heroChoreography）
       ③ 切回首页时也不给 #view-home 留 transform（见 goto 函数）
     实测：视频四周像素与页面底色完全平滑衔接，看不到任何方形边界。 */
.avatar-stage{
  position:relative; border-radius:22px; width:100%; flex:1; min-height:0;
  overflow:hidden;
}
/* 首屏视频：融合模式 / 填充方式 / 滤镜 / 透明度 全部由上面的 CSS 变量控制 */
/* 【需求2】曝光与大小：
   · 高度不再铺满整个舞台，改为「顶边对齐姓名顶端、底边对齐下面两张卡底端」
     由 --video-top / --video-bottom 两个变量算出来（height = 100% - top - bottom）
   · 左右一律不动（left:0; right:0; width:100%）→ 水平中心 = 舞台中心 = 原位置，
     再用 object-fit:contain 在「不改比例的」前提下自动算出显示宽度（3:4 等比） */
.avatar-video{
  position:absolute; left:0; right:0; top:var(--video-top);
  height:calc(100% - var(--video-top) - var(--video-bottom));
  width:100%;
  display:block;
  object-fit:var(--video-object-fit);
  mix-blend-mode:var(--video-blend-mode);
  filter:var(--video-filter);
  opacity:var(--video-opacity);
  pointer-events:none;
  /* 【本轮需求3】人像大小 / 位置微调：
     · 用 transform:scale() 缩放「整个视频」，容器 .avatar-stage 的尺寸位置一行没动；
     · 它是纯视觉变换，不参与布局 → 不会把下面的卡片挤走、也不会改变视频框本身；
     · 缩放中心 --video-origin-y 反算自「缩放后脚底仍停在原高度」，所以大小和上下位置一次到位。
     注：transform 与 mix-blend-mode 写在同一元素上是安全的（两者都只是这个元素自己的渲染方式，
         不会像「祖先元素加 transform」那样把背板隔开而让正片叠底失效）。 */
  transform:scale(var(--video-scale));
  transform-origin:50% var(--video-origin-y);
  /* ---- 【本轮需求2】边缘处理：右下角水印「角部挖洞」+（备用）底部渐隐 / 四边羽化 ----
     ★ 本次素材 hero.mp4 唯一需要处理的就是「右下角的豆包AI生成水印」：
       它位于画面 x 70%~96%、y 92%~97%，而且那一小块底本身也比别处暗，
       正片叠底后会留下「一块 −10~−15 的淡灰印子 + 文字形状的亮边」。
       （实测：水印那一块的局部对比 p95−p5 = 15.6，而页面底色只有 1.9 → 肉眼可见。）
       人像的鞋底最远只到画面 x≈67%（逐帧扫过 40 帧确认），所以整块右下角可以直接不渲染。

     做法：用一条 conic-gradient 在遮罩上挖掉「以角点为顶点、向右向下张开的 90° 扇形」——
       这个扇形的两条边正好是过角点的竖直线与水平线，所以它等价于一个「矩形角洞」；
       而 mask 是多层取交集（intersect），这一层透明的地方整体就透明。

     ★★ 想调这块：只改下面三个变量
        --wm-cut-x    ：角点的横向位置（相对「视频框」宽度）。改成 100% 就等于关掉这个挖洞
        --wm-cut-y    ：角点的纵向位置（相对「视频框」高度）
        --wm-cut-soft ：两条边各自的羽化角度（deg），越大过渡越柔（6deg ≈ 边界处 6px 渐变）
     ★ 为什么 x 是 65.4% 而不是 70%？因为 mask 的百分比是相对「视频框」算的，而画面
       （object-fit:contain 后的实际内容）只占视频框宽度的 302.1/392 = 77.1%，并且左右居中：
       画面 70% → 视频框 11.5% + 70%×77.1% = 65.4%。（app 里 392×537 这个框在所有视口都不变，
       已实测 480~1920 宽度下完全一致，所以这个百分比可以写死。）

     —— 下面 ①② 两条「四边渐隐」是留给以后换素材用的备用开关 ——
     ① 底部渐隐：现在 100% = 不裁。本次素材底边那条暗带正好压在鞋底下面，属于自然接触阴影，
        保留反而更真实；若以后换成「底边有一条硬黑边」的素材，填 98% / 100% 即可把最后 2% 渐隐掉。
     ② 四边羽化：若视频底残留明显、能看见矩形边界，把 --mask-side 调到 3%~4%、--mask-top 调到 2%~3%
        （注意：羽化会同时把人物边缘洗淡，人像贴边时要慎用）。 */
  --mask-top:0%;      /* 上边渐隐宽度：0 = 不渐隐 */
  --mask-side:0%;     /* 左右渐隐宽度：0 = 不渐隐 */
  --mask-b-start:100%;/* 底部渐隐起点：100% = 不裁 */
  --mask-b-end:100%;  /* 底部完全透明的位置：100% = 不裁 */
  --wm-cut-x:65.4%;   /* 右下角挖洞的角点横向位置（100% = 关闭挖洞） */
  --wm-cut-y:90%;     /* 右下角挖洞的角点纵向位置 */
  --wm-cut-soft:6deg; /* 挖洞两条边的羽化角度 */
  -webkit-mask-image:
    linear-gradient(180deg, transparent 0, #000 var(--mask-top), #000 var(--mask-b-start), transparent var(--mask-b-end)),
    linear-gradient(90deg, transparent 0, #000 var(--mask-side), #000 calc(100% - var(--mask-side)), transparent 100%),
    conic-gradient(from 90deg at var(--wm-cut-x) var(--wm-cut-y),
      #000 0deg, transparent var(--wm-cut-soft),
      transparent calc(90deg - var(--wm-cut-soft)), #000 90deg);
  mask-image:
    linear-gradient(180deg, transparent 0, #000 var(--mask-top), #000 var(--mask-b-start), transparent var(--mask-b-end)),
    linear-gradient(90deg, transparent 0, #000 var(--mask-side), #000 calc(100% - var(--mask-side)), transparent 100%),
    conic-gradient(from 90deg at var(--wm-cut-x) var(--wm-cut-y),
      #000 0deg, transparent var(--wm-cut-soft),
      transparent calc(90deg - var(--wm-cut-soft)), #000 90deg);
  -webkit-mask-composite:source-in;   /* WebKit 旧语法：多层取交集 */
  mask-composite:intersect;           /* 标准语法：多层取交集 */
}
/* ============================================================
   【需求1】首屏右侧三枚悬浮标签（PM / AI / Data）
   ------------------------------------------------------------
   统一尺寸（三枚完全一致）：
     · 高度 --chip-h = 33px  ← 等于左侧「OPEN TO OPPORTUNITIES」标签的高度
     · 宽度 --chip-w = 64.9px ← 就是 PM 标签原来的自然宽度（一个像素没改）
   垂直位置（全部以 .avatar-card 的定位盒为基准，它正好等于首屏右侧的可视区域）：
     · PM   → top:0           顶边 = 左侧 tagline 顶边
     · AI   → bottom:157.5px  中心 = 「独立项目」底边 与 「联系我」顶边 的正中
     · Data → bottom:36px     底边 = 「技能图谱 / 联系我」两张卡的底边
   水平位置：left / right 一律沿用原值 → 左右不动，只改高度和上下位置
   ★ 三枚标签仍保留原有的上下浮动动画（±12px）。上面标定的是「静止基准位置」，
     也就是动画每一轮起点（translateY(0)）时的位置 —— 从截图上看会随动画相位有轻微出入。 */
.float-chip{
  --chip-w:64.9px;   /* = PM 标签原生宽度 */
  --chip-h:33px;     /* = 左侧 OPEN TO OPPORTUNITIES 标签高度 */
  position:absolute; background:#fff; border:1px solid var(--line); border-radius:999px;
  width:var(--chip-w); height:var(--chip-h);
  padding:0 6px; font-size:11.5px; font-weight:800; box-shadow:var(--sh);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.float-chip svg{ width:13px;height:13px; flex:0 0 auto; }
.fc1{ top:0;    left:-26px; color:var(--orange); animation:floaty 5s   ease-in-out infinite; }
/* AI：中心 = 「独立项目」底边 与 「联系我」顶边 的正中（两行卡片的缝隙中点）。
   这个中点不是固定像素 —— 窗口变矮时它会跟着上移，所以用 calc 跟着定位盒高度走：
       50%                    定位盒高度的一半（高度 = 首屏右侧可视高度，随窗口自适应）
     − 134.5px                首屏上方固定内容（标签行 / 姓名 / 角色行 / 56px 间距）换算出的常量
     + (上移量 + 下移量) / 2   两行卡片各自上移后，缝隙中点整体上移的平均值
   → 不管窗口多高、也不管你把 --entry-lift-* 改成多少，AI 都会自动落在缝隙正中。 */
.fc2{ bottom:calc(50% - 134.5px + (var(--entry-lift-top) + var(--entry-lift-bottom)) / 2); right:-24px; color:var(--pink); animation:floaty 5.6s ease-in-out .8s infinite; }
/* Data：底边 = 「技能图谱 / 联系我」两张卡的底边。
   卡片底边与卡片区下沿始终相差「一个 --entry-lift-bottom」→ 直接引用同一个变量即可。 */
.fc3{ bottom:var(--entry-lift-bottom); left:6px; color:var(--blue); animation:floaty 6.4s ease-in-out .4s infinite; }

/* ============================================================
   4. 时间轴（我的经历）
   ============================================================ */
.tl{ position:relative; padding-left:34px; }
.tl::before{
  content:''; position:absolute; left:9px; top:14px; bottom:14px; width:3px; border-radius:3px;
  background:linear-gradient(180deg,var(--sky),var(--blue) 45%,var(--pink));
  opacity:.28;
}
.tl-node{ position:relative; margin-bottom:var(--section-gap); }
.tl-node:last-child{ margin-bottom:0; }
/* 圆点与右侧节点名垂直居中对齐：节点名行固定 30px 高，圆点中心 = 行中心 15px */
.tl-node::before{
  content:''; position:absolute; left:-34px; top:4px; width:22px;height:22px; border-radius:50%;
  background:#fff; border:4px solid var(--blue);
  box-shadow:0 0 0 6px rgba(27,132,240,.12);
}
.tl-node[data-idx="0"]::before{ border-color:var(--sky); box-shadow:0 0 0 6px rgba(76,194,247,.16); }
.tl-node[data-idx="1"]::before{ border-color:var(--orange); box-shadow:0 0 0 6px rgba(255,154,61,.16); }
.tl-node[data-idx="2"]::before{ border-color:var(--pink); box-shadow:0 0 0 6px rgba(255,124,182,.16); }

.node-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; min-height:30px; }
.node-name{ font-size:20px; font-weight:900; letter-spacing:-.2px; }
.node-time{
  font-size:11.5px; font-weight:800; color:var(--blue);
  background:rgba(27,132,240,.09); padding:5px 12px; border-radius:999px;
  display:inline-flex; align-items:center; gap:5px;
}
.node-time svg{ width:12px;height:12px; }
.node-line{ flex:1; height:1px; background:var(--line); min-width:20px; }

/* 严格网格：
   · 两列等宽，列宽 W = (容器宽 - G) / 2，行距 = 列距 G = --gap
   · 行高基准 --card-h（H）→ 同页所有卡片高度分毫不差
   · 需要横跨整页的卡片（立臻科技）用 grid-column:span 2 → 宽度正好 2W + G */
/* 【新阶段要求1】12 张卡片尺寸绝对统一：
   · 两列等宽（1fr 1fr）→ 宽度必然相等
   · grid-auto-rows 锁定行高 → 同页每一行、每一张卡高度必然相等
   · align-items:stretch 显式声明 → 卡片撑满所属行，杜绝「有的高有的矮」
   · 行距 = 列距 = --gap → 横向与纵向间距统一
   已实测：3 个节点 12 张卡全部 528×326，行间距恒为 22，行起点间距恒为 348（=326+22） */
.node-grid{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--gap); grid-auto-rows:var(--card-h); min-width:0;
  align-items:stretch;
}
.node-grid.g1 > .card{ grid-column:span 2; }

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
  /* 上下内边距扣掉 1px 边框 → 「卡片最外缘到内容」正好等于 --card-padding */
  padding:calc(var(--card-padding) - 1px) var(--card-padding);
  box-shadow:var(--sh); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  min-width:0; min-height:0;   /* 高度完全由网格行高决定 */
  transition:.34s cubic-bezier(.22,.8,.3,1);
}
.card:hover{ box-shadow:var(--sh-h); transform:translateY(-4px); border-color:rgba(27,132,240,.24); }
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,var(--sky),var(--blue),var(--royal));
  opacity:.85;
}
.card[data-accent="yellow"]::before{ background:linear-gradient(90deg,var(--yellow),var(--orange)); }
.card[data-accent="pink"]::before{ background:linear-gradient(90deg,var(--pink),var(--violet)); }
.card[data-accent="lime"]::before{ background:linear-gradient(90deg,var(--lime),var(--sky)); }

/* 标题行：图标与文字垂直居中对齐；主标题/副标题同字号同字重
   margin-bottom 与卡片上下内边距同值 → 卡片内三处垂直留白完全相等 */
.card-head{ display:flex; align-items:center; gap:12px; min-height:34px; margin-bottom:var(--card-padding); }
.card-title{ font-size:16px; line-height:1.34; font-weight:800; letter-spacing:.1px; }
/* 主标题深色；副标题蓝灰色（铁律：绝不全改成黑色） */
.t-main,.t-sub{ font-size:16px; font-weight:800; }
.t-main{ color:var(--ink); }
.t-sub{ color:var(--ink-2); }
.t-plus{ color:var(--blue); font-weight:900; font-size:15px; padding:0 4px; }
.card-time{
  flex:0 0 auto; font-size:10.5px; font-weight:800; color:var(--orange);
  background:rgba(255,154,61,.12); padding:4px 10px; border-radius:999px;
}
.card-ico{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto; display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--sky),var(--blue));
}
.card[data-accent="yellow"] .card-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); }
.card[data-accent="pink"] .card-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); }
.card[data-accent="lime"] .card-ico{ background:linear-gradient(135deg,var(--lime),#3FBBA0); }
.card-ico svg{ width:18px;height:18px; }

/* 卡片右下角淡装饰图标：让等高的稀疏卡片不至于空得发慌 */
.card-wm{
  position:absolute; right:-16px; bottom:-20px; width:138px; height:138px;
  color:var(--sky); opacity:.075; pointer-events:none; z-index:0;
}
.card-wm svg{ width:100%; height:100%; }
.card-head, .chips, .dual{ position:relative; z-index:1; }

/* 卡片内左右双屏 */
.dual{ flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; min-height:0; min-width:0; }
.pane{
  border-radius:var(--r-lg); background:linear-gradient(170deg,#F5FBFF,#EDF7FF);
  border:1px solid var(--line); padding:12px; display:flex; flex-direction:column; min-height:0; min-width:0; position:relative;
}
.pane-label{
  font-size:11px; font-weight:800; color:var(--ink-2); letter-spacing:.4px;
  display:flex; align-items:center; gap:6px; margin-bottom:10px; flex:0 0 auto;
}
.pane-label svg{ width:13px;height:13px; color:var(--blue); }

/* ============================================================
   占位符统一样式
   ------------------------------------------------------------
   【需求3】页面上所有「图片上传区域」的空态占位框，一律以
   「CET-4 学习证明」那个框（= 原 .ph 基础样式）为唯一基准。
   基准长什么样：1.5px 蓝色虚线框 + 淡蓝渐变底 + 居中图标(22px) + 居中文字(10.5px)。
   ★ 下面这 5 个变量就是全套基准值，改这里 = 所有占位框一起改：
       --ph-dash  虚线框（粗细 / 线型 / 颜色）
       --ph-bg    底色（淡蓝渐变）
       --ph-ink   图标与文字的颜色
       --ph-ico   图标尺寸
       --ph-txt   文字尺寸
   ★ 原来「论文封面图」用的 .ph-sm（更小的图标/文字）和 .ph-frame（白色实线相框）
     已删除 —— 它们就是造成各占位框长得不一样的根源。 */
:root{
  --ph-dash:1.5px dashed rgba(27,132,240,.36);
  --ph-bg:linear-gradient(150deg,rgba(255,255,255,.9),rgba(234,247,255,.9));
  --ph-ink:var(--blue);
  --ph-ico:22px;
  --ph-txt:10.5px;
}
.ph{
  border-radius:var(--r-md); border:var(--ph-dash);
  background:var(--ph-bg);
  display:grid; place-items:center; place-content:center; gap:6px;
  color:var(--ph-ink); text-align:center; padding:8px;
}
.ph svg{ width:var(--ph-ico);height:var(--ph-ico); opacity:.7; }
.ph span{ font-size:var(--ph-txt); font-weight:800; letter-spacing:.3px; }
/* 拉长的封面占位框（论文封面 / 证书照片）：只影响宽度，虚线与图标全用上面的基准 */
.ph-cover{ width:100%; }
/* 【本轮要求6】荣誉证书卡：一张图 → 两张并列图片上传区
   两列等分（1fr 1fr）→ 两张占位框的宽/高/圆角/边框天然完全一致；
   每张图下方各挂一条说明标签，取代原来的底部标签行
   【新阶段要求2】① 图片框高度由 JS 内联锁定 160（= 论文卡 coverH）
                 ② gap 9 → 24（= 论文卡的 coverGap）→ 说明标签与论文卡标签行同 y
                 ③ .cert-cap 的字号/行高/内边距对齐 .chips-lg .chip → 高度 29.2 分毫不差 */
.cert-pair{
  flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px; align-content:start;
}
.cert-item{ display:flex; flex-direction:column; gap:24px; min-width:0; }
.cert-item > .ph{ flex:0 0 auto; }
.cert-cap{
  flex:0 0 auto; text-align:center; font-size:11px; line-height:1.2; font-weight:800; letter-spacing:.2px;
  color:var(--blue-d); background:rgba(27,132,240,.08);
  border:1px solid rgba(27,132,240,.16); border-radius:999px; padding:7px 8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ============================================================
   5. 卡片类型专属动效
   ============================================================ */

/* --- 5.1 抖音数据卡 --- */
/* 横屏固定 16:9，垂直居中 → 与右侧竖屏数据卡高度协调，不再留一大片空 */
/* 【需求4】这块不再有上传功能，直接播放同目录下的 morning.mp4 */
.video-ph{
  position:relative; aspect-ratio:16/9; width:100%; margin:auto 0; flex:0 0 auto;
  border-radius:var(--r-md); overflow:hidden; background:#0F3556;
  box-shadow:0 8px 22px rgba(15,53,86,.26);
}
.news-video{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  object-fit:contain;        /* 完整播放，绝不裁切画面 */
  background:#0F3556;        /* 万一比例对不上，露出的也是深蓝底而不是黑边 */
  cursor:zoom-in;
}
/* 悬浮提示（伪元素，不参与文字编辑） */
.video-ph::after{
  content:'点击放大 · 开声音'; position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  white-space:nowrap; font-size:10px; font-weight:800; letter-spacing:.2px; color:#fff;
  background:rgba(15,53,86,.7); border-radius:999px; padding:3px 10px;
  opacity:0; transition:.22s; pointer-events:none; z-index:3; backdrop-filter:blur(4px);
}
.video-ph:hover::after{ opacity:1; }
/* 手机按 9:16 等比，尺寸收到刚好装进半个卡片的高度 */
.phone{
  width:94px; margin:auto; flex:0 0 auto;
  border-radius:16px; background:#0F3556; padding:4px;
  box-shadow:0 10px 26px rgba(15,53,86,.34);
}
.phone-screen{
  position:relative; border-radius:12px; overflow:hidden; aspect-ratio:9/16;
  background:#000;                 /* 【需求6】竖屏容器铺黑底 */
  display:flex; flex-direction:column;
}
/* 【需求4 + 需求6】爆款数据 = 同目录下的 douyin.mp4（16:9 横屏）：
   · object-fit:contain → 视频完整装进 9:16 的竖屏容器里：绝不裁切、绝不变形
   · 容器与视频自身都是纯黑底 → 上下两条空档自然补成「黑边」，
     观感就是抖音里「竖屏刷到横屏视频」的那种上下留黑
   · 侧边点赞 / 评论 / 收藏、左下角浏览量仍浮在视频之上（z-index 更高） */
.phone-video{
  position:absolute; inset:0; width:100%; height:100%; display:block;
  object-fit:contain;
  background:#000;
  cursor:zoom-in;
}
.phone-screen::after{
  content:'点击放大'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  white-space:nowrap; font-size:9px; font-weight:800; color:#fff;
  background:rgba(15,53,86,.72); border-radius:999px; padding:3px 8px;
  opacity:0; transition:.22s; pointer-events:none; z-index:3;
}
.phone-screen:hover::after{ opacity:1; }
.side-acts{ position:absolute; right:5px; bottom:30px; display:flex; flex-direction:column; gap:9px; z-index:2; }
.act{ display:flex; flex-direction:column; align-items:center; gap:1px; color:#fff; }
.act svg{ width:15px;height:15px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
.act b{ font-size:8.5px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.5); }
.act.beat svg{ color:#FF6B8B; animation:beat 1.05s ease-in-out infinite; transform-origin:center; }
@keyframes beat{ 0%,100%{transform:scale(1)} 18%{transform:scale(1.32)} 36%{transform:scale(1)} 54%{transform:scale(1.2)} }
.phone-views{
  position:absolute; left:6px; bottom:7px; z-index:2; color:#fff;
  font-size:8.5px; font-weight:800; display:flex; align-items:center; gap:3px;
  background:rgba(15,53,86,.55); padding:2px 6px; border-radius:999px;
  backdrop-filter:blur(4px);
}
.phone-views svg{ width:10px;height:10px; }
/* 手机内已含浏览量/点赞，下方不再重复展示（旧图例样式已移除） */

/* --- 5.2 标签芯片 --- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; }
.chip{
  font-size:11.5px; font-weight:700; line-height:1.2; padding:7px 13px; border-radius:999px;
  background:rgba(27,132,240,.08); color:var(--blue-d);
  border:1px solid rgba(27,132,240,.14);
  opacity:0; transform:translateY(10px) scale(.9);
  transition:.5s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .chip{ opacity:1; transform:none; }
.chip.c-y{ background:rgba(255,210,77,.22); color:#9A6A00; border-color:rgba(255,210,77,.42); }
.chip.c-o{ background:rgba(255,154,61,.15); color:#B85C00; border-color:rgba(255,154,61,.32); }
.chip.c-p{ background:rgba(255,124,182,.15); color:#B23A76; border-color:rgba(255,124,182,.32); }
.chip.c-g{ background:rgba(127,216,106,.18); color:#3B7A2A; border-color:rgba(127,216,106,.38); }
.chips-lg .chip{ font-size:11px; line-height:1.2; padding:7px 11px; }
/* 内容少的标签卡：标签组垂直居中，避免顶部堆一坨下面空一片 */
.chips-fill{ flex:1; align-content:center; }
/* 均匀分布撑满整行（列数由渲染器按标签数量写入 grid-template-columns） */
.chips-even{ display:grid; gap:8px; }
.chips-even .chip{ display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 6px; }
/* 【要求3】标签按自然宽度等距铺满整行（不换行、不拉伸）
   —— 用于「优秀毕业论文 / 荣誉与证书」这类带封面图的卡：
   ① 4 个标签若用等分列宽，「266个国家非均衡面板」会被压成两行；
   ② space-evenly 让「标签之间」和「标签到卡片边缘」的留白完全相等，
      4 个标签时铺满整行，2 个标签时自动在整行内居中对称，两张卡排布规则一致 */
.chips-spread{ justify-content:space-evenly; gap:8px; }
.chips-spread .chip{ white-space:nowrap; flex:0 0 auto; }
/* 固定 3 等分一行（AI 落地卡片左右两侧各一行 3 标签） */
.chips-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.chips-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }

/* --- 5.3 3D 翻转卡（亨通项目 2×2 / 课题九宫格 3×3） --- */
.flip-grid{ display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:10px; flex:1; min-height:0; }
.flip-grid.g3{ grid-template-columns:repeat(3,1fr); gap:10px; }
.flip{
  display:block; perspective:900px; cursor:pointer;
  background:transparent; border:none; padding:0; font:inherit; min-width:0;
  /* 【需求1】给翻转按钮（.flip-btn）一个定位参照 */
  position:relative;
}
.flip-inner{
  display:block; position:relative; width:100%; height:100%; min-height:0;
  transform-style:preserve-3d; transition:transform .68s cubic-bezier(.22,.8,.3,1);
}
.flip.on .flip-inner{ transform:rotateY(180deg); }
/* 【需求1·关键修复】「看得见的那一面」才接收鼠标事件。
   问题根源：backface-visibility:hidden 只负责「不画背面」，并不负责「不接收点击」——
   卡片翻到背面后，那张已经转过去、肉眼看不见的正面仍然盖在上层参与命中测试，
   于是点背面的字，事件全被正面吃掉 → 背面文字永远点不进编辑态（光标进不去、打不了字）。
   解法：不翻转时只放行正面；一旦 .on 翻转，就撤掉正面的 pointer-events、把背面打开。
   这样背面文字才是真正可点、可聚焦、可编辑的那一层。 */
.flip-front{ pointer-events:auto; }
.flip-back { pointer-events:none; }
.flip.on .flip-front{ pointer-events:none; }
.flip.on .flip-back { pointer-events:auto; }

/* 【需求1】编辑模式专用的「翻转」小按钮（右上角）
   · 只在编辑模式出现（body.edit-on）→ 非编辑模式下点击整张卡照旧翻转，视觉零变化
   · 编辑时「点文字 = 改文字」已经占满了整个卡面，翻转这件事必须另给一个明确入口，
     否则想改背面的字就永远翻不过去（何况原来还有 2 秒自动翻回，根本来不及打字）
   · 用 span 而不是 button：.flip 本身已经是 <button>，按钮不能嵌套按钮 */
.flip-btn{
  display:none; position:absolute; top:4px; right:4px; z-index:8;
  width:20px; height:20px; border-radius:50%; box-sizing:border-box;
  align-items:center; justify-content:center;
  border:1px solid rgba(27,132,240,.38); background:rgba(255,255,255,.96);
  color:#1B84F0; font-size:11px; font-weight:900; line-height:1;
  box-shadow:0 2px 8px rgba(23,116,196,.24);
  cursor:pointer; -webkit-user-select:none; user-select:none;
}
body.edit-on .flip-btn{ display:flex; }
.flip-btn:hover{ background:#1B84F0; color:#fff; border-color:#1B84F0; }
/* 背面的白字在编辑模式下要把光标（caret）也染成白色，否则看不见插入点 */
body.edit-on .flip-back .flip-txt{ caret-color:#fff; }
body.edit-on .flip-front .flip-txt{ caret-color:#1B84F0; }
.flip-face{
  position:absolute; inset:0; border-radius:var(--r-md);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center; gap:6px; text-align:center; padding:9px 8px;
  overflow:hidden;
}
/* 正面：马卡龙浅色渐变，不再是纯白；右上角无任何装饰图标 */
.flip-front{
  background:linear-gradient(150deg,#EAF5FF,#D3E9FF);
  border:1px solid rgba(27,132,240,.2);
  font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.32;
  box-shadow:0 4px 14px rgba(23,116,196,.09);
}
.flip[data-tone="o"] .flip-front{ background:linear-gradient(150deg,#FFF4E4,#FFE3C4); border-color:rgba(255,154,61,.26); }
.flip[data-tone="p"] .flip-front{ background:linear-gradient(150deg,#FFF0F7,#FFD9E9); border-color:rgba(255,124,182,.26); }
.flip[data-tone="v"] .flip-front{ background:linear-gradient(150deg,#F3F0FF,#E1DAFF); border-color:rgba(139,124,255,.26); }
.flip-grid.g3 .flip-face{ padding:8px 6px; }
.flip-grid.g3 .flip-front{ font-size:10.5px; line-height:1.3; font-weight:800; }
.flip-grid.g3 .flip-back{ font-size:10px; }
.flip-back{
  transform:rotateY(180deg);
  background:linear-gradient(140deg,var(--blue),var(--royal));
  color:#fff; font-size:11.5px; font-weight:800; line-height:1.35;
  box-shadow:0 8px 22px rgba(27,132,240,.32);
}
.flip:hover .flip-front{ box-shadow:0 8px 20px rgba(23,116,196,.16); }

/* --- 5.4 甘特图 --- */
.gantt{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:9px; }
.gantt-row{ display:grid; grid-template-columns:58px 1fr; align-items:center; gap:8px; }
.gantt-row span{ font-size:9.5px; font-weight:800; color:var(--ink-3); }
.gantt-track{ height:11px; border-radius:999px; background:rgba(27,132,240,.08); overflow:hidden; }
.gantt-bar{
  height:100%; border-radius:999px; transform-origin:left center; transform:scaleX(0);
  transition:transform 1.05s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .gantt-bar{ transform:scaleX(1); }
.g1b{ background:linear-gradient(90deg,var(--sky),var(--blue)); }
.g2b{ background:linear-gradient(90deg,var(--yellow),var(--orange)); }
.g3b{ background:linear-gradient(90deg,var(--pink),var(--violet)); }
.g4b{ background:linear-gradient(90deg,var(--lime),#3FBBA0); }
/* 甘特图下方的阶段节点：6 个平分宽度撑满 */
.gantt-stages{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:5px; margin-top:3px; }
.gantt-stage{
  text-align:center; font-size:8.8px; font-weight:800; color:var(--ink-2);
  background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 2px;
  box-shadow:0 3px 10px rgba(23,116,196,.07);
  opacity:0; transform:translateY(8px);
  transition:.5s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .gantt-stage{ opacity:1; transform:none; }

/* --- 5.5 IPD 体系树 ---
   【新阶段要求1】右树内容带仍严格对齐左甘特内容带（甘特内容 125.5→284.5 = 159px），总高不变。
   四行垂直间距重排：第1行(体系架构)/第4行(TR·DCP·变更)固定不动，
   第2行(组织·职责·评审)下移、第3行(流程机制)上移 → 组内间距(gap12=gap34)加大且严格相等，
   组间间距(gap23)收缩。
   · 组内 gap 6→13px（.tree-group），组间 gap 29→15px（.tree）
   · 树内容 = 2×(30+13+29) + 15 = 159，与改动前 2×65+29=159 完全一致 → 上下边缘仍与甘特对齐 */
.tree{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px; }
.tree-group{ display:flex; flex-direction:column; gap:13px; width:100%; }
.tree-root{
  display:flex; align-items:center; justify-content:center; gap:7px; font-size:11.5px; font-weight:900; color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--royal));
  padding:7px 12px; border-radius:9px; width:100%;
  box-shadow:0 6px 16px rgba(27,132,240,.26);
}
.tree-root svg{ width:13px;height:13px; }
/* 树节点标签拉宽撑满整行 */
.tree-kids{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.tree-kid{
  font-size:10.5px; font-weight:800; color:var(--blue-d); text-align:center;
  background:#fff; border:1px solid rgba(27,132,240,.22);
  padding:6px 4px; border-radius:8px; box-shadow:0 3px 10px rgba(23,116,196,.08);
}
.tree-kid.k2{ color:#B85C00; border-color:rgba(255,154,61,.34); }

/* --- 5.6 对话气泡（智能客服） --- */
/* 竖直方向撑开分布，避免卡片被同行高卡撑高后中间空一大片 */
.chat{ flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:10px; min-height:0; }
/* 【要求2】智能客服：安全场景一轮问答
   · justify-content:space-evenly → 面板剩余高度全部均分成「标签↔首条气泡」
     「气泡之间」「末条↔面板底」的留白，彻底解决拥挤
   · gap:6px 作为最小间距兜底，容器再矮也不会黏在一起 */
.chat-qa{ justify-content:space-evenly; gap:6px; overflow:hidden; }
.chat-qa .bubble{ font-size:9.8px; line-height:1.38; padding:6px 10px; border-radius:11px; max-width:94%; }
/* 【本轮要求5】模拟对话：提问 / 回答 两枚气泡底色对调
   · 提问（左）原先蓝底白字 → 改为白底深灰字（描边 + 轻投影，保证在浅色面板上依然立得住）
   · 回答（右）原先白底深字 → 改为蓝底白字
   只换配色，左右站位与小尖角方向保持原样 */
.chat-qa .bubble.q{
  background:#fff; color:var(--ink-2); border:1px solid var(--line);
  box-shadow:var(--sh); border-bottom-left-radius:4px;
}
.chat-qa .bubble.a{
  background:linear-gradient(135deg,var(--blue),var(--royal)); color:#fff;
  border:1px solid transparent; box-shadow:0 6px 16px rgba(27,132,240,.22);
  border-bottom-right-radius:4px;
}
.chat-qa .typing{ padding:5px 9px; border-radius:11px 11px 11px 4px; }
/* 【要求2】AI落地卡：面板标题 / 标签行 / 内容区 三段之间的垂直间距整体拉大
   （原来的 10px → 20px，左右两栏同值，视觉重心保持同一水平线） */
.dual.ai-spread .pane-label{ margin-bottom:20px; }
.dual.ai-spread .ai-tags{ margin-bottom:20px; }
/* 「在线」挪到面板标题行最右，字号与标题一致 */
.pl-right{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:800; color:#2FA37F;
}
.on-dot{
  width:6px;height:6px;border-radius:50%; background:var(--lime); flex:0 0 auto;
  animation:pulse 1.6s ease-in-out infinite;
}
.bubble{
  font-size:12.5px; font-weight:700; padding:10px 15px; border-radius:15px; max-width:88%;
  background:linear-gradient(135deg,var(--blue),var(--royal)); color:#fff;
  border-bottom-left-radius:5px; align-self:flex-start;
  opacity:0; transform:translateY(14px) scale(.94);
  transition:.55s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
  box-shadow:0 6px 16px rgba(27,132,240,.22);
}
.is-in .bubble{ opacity:1; transform:none; }
.bubble.b2{ background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:var(--sh); border-bottom-left-radius:15px; border-bottom-right-radius:5px; align-self:flex-end; }
.bubble b{ color:var(--yellow); font-weight:900; }
.bubble.b2 b{ color:var(--orange); }
.bubble.sm{ font-size:9.5px; padding:5px 9px; border-radius:10px; }
/* 【本轮要求6】智译通「AI回答提示」两枚气泡底色对调：
   .lite    → 白底深灰字（描边 + 轻投影），仍靠左
   .solid-r → 沿用基础蓝底白字，显式靠右（原来靠右靠的是 .b2，换成实心底色后需单独指定）
   位置与圆角保持原样，只交换配色 */
.bubble.lite{ background:#fff; color:var(--ink-2); border:1px solid var(--line); box-shadow:var(--sh); }
.bubble.solid-r{ align-self:flex-end; box-shadow:0 6px 16px rgba(27,132,240,.22); }
.typing{
  display:flex; gap:4px; align-items:center; align-self:flex-start;
  background:#fff; border:1px solid var(--line); padding:8px 11px; border-radius:13px 13px 13px 4px;
  box-shadow:var(--sh); opacity:0; transition:.5s .5s;
}
.is-in .typing{ opacity:1; }
.typing i{ width:5px;height:5px;border-radius:50%;background:var(--sky-l); animation:type 1.25s ease-in-out infinite; }
.typing i:nth-child(2){ animation-delay:.18s; }
.typing i:nth-child(3){ animation-delay:.36s; }
@keyframes type{ 0%,60%,100%{ transform:translateY(0); background:var(--sky-l);} 30%{ transform:translateY(-4px); background:var(--blue);} }

/* --- 5.7 数据管线 --- */
/* 【本轮要求1】专家大模型下方动画演示区：只压高度，绝不动宽度
   ① 「感知/分析/预警/归档」文字行 ↔ 下方横线的间距 18px → 5px，整组紧贴成一个整体
   ② 不再用 space-evenly 把三组元素摊满整个面板 → 改 justify-content:center，
      整块收成「紧凑一小团」并在面板里垂直居中，不再贴到卡片底部
   ③ 用显式 margin 代替统一 gap，让「文字行↔横线」比「横线↔圆圈」更紧，
      收紧后视觉高度（≈80px）与左侧「智能客服」对话区（≈83px）基本齐平 */
.pipe{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:0; min-height:0; }
.pipe-line{ position:relative; height:4px; border-radius:4px; background:rgba(27,132,240,.12); margin:5px 4px 0; }
.pipe-flow{
  position:absolute; inset:0; border-radius:4px; overflow:hidden;
}
.pipe-flow::after{
  content:''; position:absolute; top:0; bottom:0; width:34%;
  background:linear-gradient(90deg,rgba(27,132,240,0),var(--pink),rgba(27,132,240,0));
  animation:flow 2.4s linear infinite;
}
@keyframes flow{ from{ transform:translateX(-110%);} to{ transform:translateX(320%);} }
.pipe-stops{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:15px; }
.pipe-stop{ text-align:center; position:relative; }
.pipe-stop .dot{
  width:18px;height:18px;border-radius:50%; margin:0 auto 9px;
  background:#fff; border:3px solid rgba(27,132,240,.28);
  animation:stop 3.6s ease-in-out infinite; animation-delay:var(--d,0ms);
}
@keyframes stop{
  0%,72%,100%{ border-color:rgba(27,132,240,.26); box-shadow:none; transform:scale(1); }
  18%,44%{ border-color:var(--blue); box-shadow:0 0 0 5px rgba(27,132,240,.14); transform:scale(1.22); }
}
.pipe-stop span{
  font-size:11px; font-weight:800; color:var(--ink-2);
  animation:stopTxt 3.6s ease-in-out infinite; animation-delay:var(--d,0ms);
}
@keyframes stopTxt{ 0%,72%,100%{ color:var(--ink-3);} 18%,44%{ color:var(--blue);} }
.pipe-meta{ display:flex; justify-content:space-between; font-size:10px; font-weight:800; color:var(--ink-2); letter-spacing:.4px; padding:0 2px; }

/* --- 5.8 安检通道动态场景（纯 CSS/SVG 生成，无任何静态图片占位） --- */
.gate-scene{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
/* 场景按容器高度自适应缩放，绝不超出左栏可用高度 */
.gate-svg{ width:100%; max-width:200px; max-height:100%; height:auto; display:block; overflow:visible; }
.g-frame{ fill:none; stroke:rgba(27,132,240,.30); stroke-width:1.5; }
.g-soft{ fill:rgba(27,132,240,.08); }
.g-line{ stroke:rgba(27,132,240,.16); stroke-width:1; }
.g-scanbar{ fill:rgba(76,194,247,.92); }
.g-scanglow{ fill:rgba(76,194,247,.15); }
.g-scan{ animation:gateScan 2.6s ease-in-out infinite; }
@keyframes gateScan{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(36px); } }
.g-led{ fill:#35D07F; transform-box:fill-box; transform-origin:center; animation:ledPulse 1.5s ease-in-out infinite; }
@keyframes ledPulse{ 0%,100%{ opacity:.3; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.35); } }
/* 自动闸门：按节奏开合（无人值守） */
.g-door rect{ fill:rgba(76,194,247,.28); stroke:rgba(27,132,240,.5); stroke-width:1.2; }
.g-door-l{ animation:doorL 3.4s cubic-bezier(.4,0,.2,1) infinite; }
.g-door-r{ animation:doorR 3.4s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes doorL{ 0%,16%{ transform:translateX(0); } 38%,74%{ transform:translateX(-21px); } 94%,100%{ transform:translateX(0); } }
@keyframes doorR{ 0%,16%{ transform:translateX(0); } 38%,74%{ transform:translateX(21px); } 94%,100%{ transform:translateX(0); } }
/* 传送带上自动流转的包裹 */
.g-parcel{ fill:rgba(27,132,240,.20); stroke:rgba(27,132,240,.55); stroke-width:1.2; animation:parcelRun 3.4s linear infinite; }
@keyframes parcelRun{ from{ transform:translateX(0); } to{ transform:translateX(268px); } }
/* 无人值守徽标 */
.g-badge{ fill:rgba(53,208,127,.14); stroke:rgba(53,208,127,.5); stroke-width:1; }
.g-badge-t{ font-size:9px; font-weight:800; fill:#1F8A5A; letter-spacing:.4px; }

/* 【要求5】左面板改为左右布局：安检动画在左、四项数据在右
   → 动画拿满整列高度，数据排成 2×2，纵向空间利用率更高
   【本轮要求4·高度联动】给 gate-row 加了与右侧 .ai-mon 同值的 padding-top，
   两侧内容顶部对齐、可用高度一致 → 4 个数据方块的高度自动跟右侧模块同步 */
.gate-row{
  flex:1; display:grid; grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);
  gap:10px; align-items:stretch; min-height:0; min-width:0;
  padding-top:10px;
}
.gate-row .gate-scene{ min-height:0; }
/* 4 项指标 2×2，与左侧动画同高 */
.stat-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:1fr; gap:7px; align-content:center; min-width:0; }
.stat{
  background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px 8px;
  display:flex; flex-direction:column; gap:9px; justify-content:center; min-width:0;
}
/* 【本轮要求2】4 个数据方块：标签字号对齐卡片标题（.pane-label 的 11px）→ 更醒目；
   标签 ↔ 数字 的垂直间距 2px → 9px，上下撑开不再挤成一团（数字部分保持原样不动） */
.stat i{ font-style:normal; font-size:11px; font-weight:800; color:var(--ink-2); white-space:nowrap; letter-spacing:.2px; }
.stat b{ font-size:19px; line-height:1.1; font-weight:900; color:var(--blue-d); font-variant-numeric:tabular-nums; white-space:nowrap; }
.stat:nth-child(1) b{ color:var(--blue); }
.stat:nth-child(2) b{ color:var(--orange); }
.stat:nth-child(3) b{ color:var(--pink); }
.stat:nth-child(4) b{ color:#3FBBA0; }

/* --- 5.9 AI 监控总览 + 三条执行路径 --- */
/* 【要求5】上排：3 个总览数据块等分一行（原来的「2 块 + 说明文字」整体替换掉）
   【本轮要求3】左右内边距 26px → 6px：内容块横向从 480px 撑到 ≈520px，
   3 个总览块与 3 张路径卡同步变宽，左右空档显著收敛，恢复紧凑充实的观感；
   顶部 padding-top:10px 与纵向 gap:14px 一律不动 → 高度、垂直位置、上下间距零变化 */
.ai-mon{ flex:1; display:flex; flex-direction:column; gap:14px; min-height:0; padding:10px 6px 0; }
/* 【本轮要求1】6 个方块严格等宽：上方 .ai-strip 与下方 .path-row 用完全相同的
   三列网格（repeat(3,minmax(0,1fr)) + gap:8px），两块容器宽度也一致 → 6 个方块分毫不差 */
.ai-strip{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; min-width:0; }
/* 【本轮要求1】图标与文字之间的间距 7px → 13px；圆角与 .path-card 统一为 13px */
.ai-ov{
  background:#fff; border:1px solid var(--line); border-radius:13px; padding:8px 9px;
  display:flex; align-items:center; gap:13px; box-shadow:0 4px 12px rgba(23,116,196,.08); min-width:0;
}
.ai-ov-ico{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:linear-gradient(135deg,var(--sky),var(--blue));
}
.ai-ov-ico svg{ width:16px;height:16px; }
.ai-ov-ico.alarm{ background:linear-gradient(135deg,var(--orange),#FF5B5B); animation:alarmPulse 1.6s ease-out infinite; }
@keyframes alarmPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,91,91,.55); } 60%{ box-shadow:0 0 0 9px rgba(255,91,91,0); } }
.ai-ov-txt{ min-width:0; }
.ai-ov-txt b{ display:block; font-size:16px; font-weight:900; color:var(--blue-d); line-height:1.1; font-variant-numeric:tabular-nums; }
.ai-ov-txt span{ font-size:9.5px; font-weight:800; color:var(--ink-3); white-space:nowrap; }
.path-row{ flex:1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:8px; min-height:0; }
.path-card{
  background:#fff; border:1px solid var(--line); border-radius:13px; padding:6px;
  display:flex; flex-direction:column; gap:4px; min-width:0; overflow:hidden;
  box-shadow:0 4px 14px rgba(23,116,196,.08);
}
.path-top{ display:flex; align-items:center; gap:5px; }
.path-ico{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:linear-gradient(135deg,var(--sky),var(--blue));
}
.path-ico svg{ width:13px;height:13px; }
.path-card[data-tone="o"] .path-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); }
.path-card[data-tone="p"] .path-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); }
/* 【要求4】卡片变窄后「岗点安检·车间稽核」会折行 → 字号 10 → 9.5，保证三条路径标题都在一行，
   进度条因此严格对齐同一水平线 */
.path-top b{ font-size:9.5px; font-weight:900; line-height:1.25; min-width:0; }
.path-pct{ margin-left:auto; font-size:8.6px; font-weight:900; color:var(--ink-2); flex:0 0 auto; }
.path-bar{ height:5px; border-radius:4px; background:rgba(27,132,240,.12); overflow:hidden; margin-top:3px; }
.path-bar i{
  display:block; height:100%; border-radius:4px; transform-origin:left center; transform:scaleX(0);
  background:linear-gradient(90deg,var(--sky),var(--blue));
  transition:transform 1.1s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.path-card[data-tone="o"] .path-bar i{ background:linear-gradient(90deg,var(--yellow),var(--orange)); }
.path-card[data-tone="p"] .path-bar i{ background:linear-gradient(90deg,var(--pink),var(--violet)); }
.is-in .path-bar i{ transform:scaleX(1); }
.path-tags{ display:flex; flex-wrap:wrap; gap:3px; align-content:flex-start; }
/* 【要求4】「调查询问」标签固定两行：第一行 3 个、第二行 2 个
   用 flex + nowrap 让每个标签保持「自然宽度」，卡片变窄也不会被挤成两行；
   space-evenly 保证每行内间距均匀 —— 与论文/荣誉卡的 chips-spread 同一套排布逻辑 */
/* 【本轮要求1】三张路径卡统一用 tagRows：第一行 space-evenly 均匀分布，
   第二行靠 space-evenly 自动居中（单标签时即绝对居中）；
   拆卡后卡片变窄（167→141），标签左右内边距 3 → 2 保证三标签行不被裁切 */
   /* 【标签位移】三组标签整体下移量：0 = 原位，6px = 推荐，8px = 上限（再大标签会被卡片裁切） */
.path-tags-2{ display:flex; flex-direction:column; gap:2px; min-width:0; margin-top:3px; }
.path-tags-2 .ptr{ display:flex; gap:2px; justify-content:space-evenly; }
.path-tags-2 .ptr:nth-child(2){ position:relative; top:3px; }   /* ← 新增这一行 */
.path-tags-2 .path-tag{ white-space:nowrap; flex:0 0 auto; padding:3px 2px; }
.path-tag{
  font-size:8px; font-weight:800; line-height:1.15; text-align:center; padding:3px 4px; border-radius:5px;
  background:rgba(27,132,240,.08); color:var(--blue-d); border:1px solid rgba(27,132,240,.14);
}
.path-card[data-tone="o"] .path-tag{ background:rgba(255,154,61,.1); color:#B85C00; border-color:rgba(255,154,61,.24); }
.path-card[data-tone="p"] .path-tag{ background:rgba(255,124,182,.1); color:#B23A76; border-color:rgba(255,124,182,.24); }

/* 双屏比例：左侧安检场景稍窄，右侧 AI 监控内容较密 → 略微加宽 */
.dual.ai{ grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); }
/* 【本轮要求9】拆分成独立小卡片后，一张卡里只放一个 pane
   → 用 .solo 把双栏压成单栏，pane 直接吃满整卡宽度；
   必须写在 .dual / .dual.ai / .dual.ai-spread 之后，同权重下靠顺序取胜 */
.dual.solo{ grid-template-columns:minmax(0,1fr); }
/* 拆分后的卡片：pane 直接挂在 .card 下（不再有 .dual 包裹）时同样撑满剩余高度 */
.card > .pane{ flex:1; min-height:0; }

/* --- 5.9b 综合能力矩阵（客户对接卡左侧） --- */
/* 3 列 × 2 行：横跨卡片剩余高度，图标+标签完整放下 */
.cap-matrix{ flex:1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:9px; min-height:0; }
.cap{
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:0;
  box-shadow:0 4px 12px rgba(23,116,196,.07);
  opacity:0; transform:translateY(10px) scale(.96);
  transition:.5s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .cap{ opacity:1; transform:none; }
.cap-ico{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:linear-gradient(135deg,var(--sky),var(--blue));
}
.cap-ico svg{ width:16px;height:16px; }
.cap[data-tone="o"] .cap-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); }
.cap[data-tone="p"] .cap-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); }
.cap[data-tone="v"] .cap-ico{ background:linear-gradient(135deg,var(--violet),#5B7BFF); }
.cap[data-tone="g"] .cap-ico{ background:linear-gradient(135deg,var(--lime),#3FBBA0); }
.cap b{ font-size:11.5px; font-weight:800; line-height:1.25; text-align:center; }

/* --- 5.10 流程节点 + 证书滑出 --- */
.flow{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:0; }
.flow-row{ display:flex; align-items:center; }
.flow-node{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; width:74px; }
.flow-dot{
  width:22px;height:22px;border-radius:50%; display:grid;place-items:center;
  background:#fff; border:2.5px solid rgba(27,132,240,.24); color:var(--ink-3);
  animation:flowDot 3.6s ease-in-out infinite; animation-delay:var(--d,0ms);
}
@keyframes flowDot{
  0%,74%,100%{ border-color:rgba(27,132,240,.24); background:#fff; color:var(--ink-3); box-shadow:none; }
  20%,46%{ border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:0 0 0 6px rgba(27,132,240,.14); }
}
.flow-dot svg{ width:11px;height:11px; }
.flow-node span{ font-size:9.5px; font-weight:800; color:var(--ink-2); text-align:center; line-height:1.3; }
.flow-bar{
  flex:1; height:2.5px; border-radius:3px; background:rgba(27,132,240,.14);
  position:relative; overflow:hidden; margin-bottom:22px;
}
.flow-bar::after{
  content:''; position:absolute; inset:0; transform-origin:left; transform:scaleX(0);
  background:linear-gradient(90deg,var(--sky),var(--blue));
  transition:transform .8s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .flow-bar::after{ transform:scaleX(1); }

/* 证书卡（点击 → 底部滑出，非翻转） */
.cert-mini{
  border:none; font:inherit; cursor:pointer; width:100%; flex:1;
  border-radius:var(--r-md); padding:12px;
  background:linear-gradient(150deg,#FFF8E4,#FFEFC4);
  border:1.5px solid rgba(214,164,40,.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  box-shadow:0 8px 22px rgba(214,164,40,.16);
  transition:.32s cubic-bezier(.22,.8,.3,1); position:relative; overflow:hidden;
}
.cert-mini:hover{ transform:translateY(-3px); box-shadow:0 14px 32px rgba(214,164,40,.26); }
.cert-mini::after{
  content:''; position:absolute; top:-60%; left:-60%; width:60%; height:220%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));
  transform:rotate(22deg); animation:shine 3.6s ease-in-out infinite;
}
@keyframes shine{ 0%{ left:-70%;} 55%,100%{ left:130%;} }
.cert-seal{
  width:40px;height:40px;border-radius:50%; display:grid;place-items:center; color:#8A6100;
  background:radial-gradient(circle at 34% 28%,#FFF2CE,#E8B93B);
  box-shadow:0 4px 12px rgba(214,164,40,.4), inset 0 0 0 2px rgba(255,255,255,.6);
}
.cert-seal svg{ width:21px;height:21px; }
.cert-mini b{ font-size:12px; font-weight:900; color:#8A6100; letter-spacing:.4px; }
.cert-mini i{ font-style:normal; font-size:9.5px; font-weight:700; color:#B08A22; }
.cert-hint{
  position:absolute; bottom:7px; right:9px; font-size:8.5px; font-weight:800; color:#B08A22; opacity:.8;
}

/* 证书滑出层（卡片内） */
.cert-overlay{
  position:absolute; inset:0; z-index:9; border-radius:var(--r-xl);
  background:rgba(15,53,86,.34); backdrop-filter:blur(5px);
  display:flex; align-items:flex-end; justify-content:center; padding:0;
  opacity:0; pointer-events:none; transition:opacity .34s;
}
.cert-sheet{
  width:100%; background:linear-gradient(160deg,#FFFDF6,#FFF5DE);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  border:2px solid rgba(214,164,40,.62); border-bottom:none;
  box-shadow:0 -14px 44px rgba(15,53,86,.3), 0 0 34px rgba(255,206,84,.5);
  padding:16px; display:flex; gap:14px; align-items:center;
  transform:translateY(102%); transition:transform .58s cubic-bezier(.22,1,.36,1);
}
.card.cert-open .cert-overlay{ opacity:1; pointer-events:auto; }
.card.cert-open .cert-sheet{ transform:none; }
.cert-ph{ width:96px; flex:0 0 auto; aspect-ratio:1/1.34; }
.cert-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.cert-info b{ font-size:14px; font-weight:900; color:#7A5400; }
.cert-info span{ font-size:10.5px; font-weight:700; color:#A98322; line-height:1.5; }
.cert-badge{
  width:72px;height:72px;border-radius:50%; flex:0 0 auto;
  display:grid;place-items:center; color:#8A6100;
  background:radial-gradient(circle at 34% 28%,#FFF4D4,#E8B93B);
  box-shadow:0 6px 18px rgba(214,164,40,.42), inset 0 0 0 3px rgba(255,255,255,.62);
  border:2px dashed rgba(160,116,10,.3);
  animation:beat 2.6s ease-in-out infinite;
}
.cert-badge svg{ width:34px;height:34px; }
.cert-close{
  align-self:flex-start; border:none; background:rgba(214,164,40,.16);
  color:#8A6100; width:24px;height:24px;border-radius:50%; cursor:pointer; font-size:13px; font-weight:900;
  display:grid; place-items:center; flex:0 0 auto;
}

/* ============================================================
   6. 独立项目
   ============================================================ */
/* 三张卡高度严格等于 H（与「亨通线缆」卡片一致）；卡片之间行距 = h（--gap） */
.proj-grid{ display:grid; gap:var(--gap); grid-auto-rows:var(--card-h); }
/* 【要求6】上下内边距收紧（24→14），内容区变高 → 内容更饱满不空；
   标题与标签之间的间距由 16 → 26 拉开，三张卡统一 */
.proj-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-xl);
  padding:14px var(--card-padding);
  box-shadow:var(--sh); position:relative; overflow:hidden;
  display:grid; grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);
  gap:52px;                          /* 左文字区 ↔ 右 UI 区 之间的整体间隙（拉大） */
  align-items:center;                /* 左右各自垂直居中，视觉重心同一条水平线 */
  transition:.34s cubic-bezier(.22,.8,.3,1);
}
.proj-card:hover{ box-shadow:var(--sh-h); transform:translateY(-4px); }
.proj-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,var(--sky),var(--blue));
}
.proj-card[data-accent="yellow"]::before{ background:linear-gradient(90deg,var(--yellow),var(--orange)); }
.proj-card[data-accent="pink"]::before{ background:linear-gradient(90deg,var(--pink),var(--violet)); }
/* 左侧信息块：上下留白完全相等（垂直居中）；标题 ↔ 标签行间距拉开到 26px */
.proj-info{ display:flex; flex-direction:column; justify-content:center; gap:26px; height:100%; min-width:0; }
/* 标题行：图标在左，紧跟主标题 · 蓝灰副标题（还原原本排版，不下移） */
.proj-head{ display:flex; align-items:center; gap:12px; min-width:0; }
.proj-title{ font-size:19px; font-weight:800; line-height:1.3; margin:0; }
.proj-title .t-main,
.proj-title .t-sub{ font-size:19px; font-weight:800; }
.proj-title .t-main{ color:var(--ink); }
.proj-title .t-sub{ color:var(--ink-2); }
.proj-title .t-plus{ font-size:18px; }
/* 【要求5】右侧 UI 区整体撑满卡片内容高度（align-self:stretch 覆盖父级 align-items:center）
   【本轮要求4】上一版把 UI 图拉得太满（≈296px），卡片上下几乎没有呼吸空间；
   现在给 .proj-visual 上下各留 20px 内边距 → UI 图回落到 ≈256px，
   在「太矮」和「太高」之间取平衡点，卡片内部上下重新有透气感；
   左侧 .proj-info 的 justify-content:center 不变 → 左右两块依旧各自垂直居中、重心同线 */
.proj-visual{ align-self:stretch; display:flex; align-items:stretch; justify-content:center; min-width:0; padding:20px 0; }
.proj-visual > *{ width:100%; }

/* 声波面板 —— 【要求5】改为纵向弹性容器：声波吃满剩余高度，两条元信息沉到底部 */
.wave-panel{
  width:100%; height:100%; border-radius:var(--r-lg); padding:20px;
  background:linear-gradient(160deg,#0E4C86,#1B84F0 70%,#4CC2F7);
  box-shadow:0 14px 40px rgba(27,132,240,.34); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
}
.wave-panel::after{
  content:''; position:absolute; inset:-40%;
  background:radial-gradient(circle at 70% 20%, rgba(255,255,255,.28), transparent 58%);
  animation:floaty 7s ease-in-out infinite;
}
/* 【要求5】声波高度由 flex:1 决定（原来写死 74px）→ 面板长高，声波跟着长高 */
.wave{ flex:1; min-height:74px; display:flex; align-items:flex-end; justify-content:center; gap:4px; position:relative; z-index:1; }
.wave i{
  width:4px; border-radius:3px; background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));
  height:20%; animation:waveA 1.15s ease-in-out infinite; transform-origin:bottom;
}
@keyframes waveA{ 0%,100%{ height:16%;} 50%{ height:96%;} }
.wave-meta{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
.wave-meta b{ font-size:11.5px; font-weight:800; color:#fff; display:flex; align-items:center; gap:6px; }
.wave-meta b svg{ width:14px;height:14px; }
.wave-meta span{ font-size:10px; font-weight:800; color:rgba(255,255,255,.72); }
.mic-btn{
  position:relative; z-index:1; width:42px;height:42px;border-radius:50%; display:grid;place-items:center;
  background:#fff; color:var(--blue); box-shadow:0 6px 18px rgba(15,53,86,.3);
  animation:pulseRing 2.1s ease-out infinite;
}
@keyframes pulseRing{ 0%{ box-shadow:0 6px 18px rgba(15,53,86,.3),0 0 0 0 rgba(255,255,255,.6);} 100%{ box-shadow:0 6px 18px rgba(15,53,86,.3),0 0 0 16px rgba(255,255,255,0);} }
.mic-btn svg{ width:20px;height:20px; }

/* 项目A：声波面板 + 本地知识库检索 + AI 回答提示（全部纯代码，无任何上传/截图占位）
   【要求5】height:100% → 左右两栏一起撑满卡片内容高度 */
.ai-app{ width:100%; height:100%; display:grid; grid-template-columns:1.04fr .96fr; gap:12px; align-items:stretch; }
.ai-app-side{ display:flex; flex-direction:column; gap:12px; min-width:0; }
.aibox{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 13px;
  box-shadow:0 10px 26px rgba(23,116,196,.10);
  display:flex; flex-direction:column; gap:8px; justify-content:space-between; flex:1; min-width:0;
}
.aibox-head{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:900; color:var(--ink-2); }
.aibox-head svg{ width:13px;height:13px; color:var(--blue); }
.kb-track{ position:relative; height:10px; border-radius:999px; background:rgba(27,132,240,.12); overflow:hidden; }
.kb-track::after{
  content:''; position:absolute; top:0; bottom:0; width:42%;
  background:linear-gradient(90deg,rgba(27,132,240,0),var(--sky),rgba(27,132,240,0));
  animation:flow 1.9s linear infinite;
}
.kb-dots{ display:flex; gap:6px; }
.kb-dots i{
  width:10px;height:10px;border-radius:50%; background:var(--sky);
  animation:kbDot 1.8s ease-in-out infinite; animation-delay:var(--d,0ms);
}
@keyframes kbDot{ 0%,100%{ opacity:.22; transform:scale(.75);} 40%{ opacity:1; transform:scale(1.15);} }
.aibox-body{ display:flex; flex-direction:column; gap:6px; justify-content:center; flex:1; }

/* 项目B：3D 悬浮双屏 —— 左前端刷题 / 右后端题库与账号（纯代码） */
/* 每块面板各自拥有独立透视原点 → 两块面板几何完全一致，
   6 个 UI 块的宽/高/长度因此绝对相等，同时保留整体悬浮的 3D 感 */
/* 【要求5】height:100% 逐层传递 → 两块 3D 面板跟着卡片一起长高，
   6 个 UI 行由 flex:1 等分剩余高度（仍然严格等高、等长） */
.stack-stage{ width:100%; height:100%; }
.stack-ui{ display:grid; grid-template-columns:1fr 1fr; gap:11px; height:100%; }
.stack-cell{ perspective:1200px; min-width:0; height:100%; }
@keyframes stackFloat{
  0%,100%{ transform:rotateY(-7deg) translateY(0); }
  50%{ transform:rotateY(-3deg) translateY(-11px); }
}
.stack-panel{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px;
  box-shadow:0 18px 40px rgba(23,116,196,.18);
  display:flex; flex-direction:column; gap:12px; min-width:0; height:100%;
  transform:rotateY(-7deg);
  animation:stackFloat 6.4s ease-in-out infinite;
}
.stack-h{ display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:900; color:var(--ink-2); height:18px; flex:0 0 auto; }
.stack-h svg{ width:13px;height:13px; color:var(--blue); }
/* 6 个 UI 行：宽 / 高 / 长度全部由 CSS 强制一致；高度改为等分撑满面板 */
.mini-row{
  background:linear-gradient(150deg,#F7FCFF,#EDF7FF); border-radius:9px; border:1px solid var(--line);
  min-height:32px; flex:1; padding:0 11px;
  display:flex; align-items:center; gap:8px; min-width:0;
}
.mini-row .dotm{ width:8px;height:8px;border-radius:50%; background:var(--sky); flex:0 0 auto; }
.mini-row b{ font-size:10px; font-weight:800; white-space:nowrap; }
.mini-bar{ height:8px; border-radius:4px; background:rgba(27,132,240,.13); flex:1; overflow:hidden; min-width:20px; }
.mini-bar i{
  display:block; height:100%; border-radius:4px; transform-origin:left center; transform:scaleX(0);
  background:linear-gradient(90deg,var(--sky),var(--blue));
  transition:transform .95s cubic-bezier(.22,.8,.3,1); transition-delay:var(--d,0ms);
}
.is-in .mini-bar i{ transform:scaleX(1); }
/* 【本轮要求7】「前端刷题管理」与「后端账号管理」两个标签外观完全统一：
   文字颜色 / 底色 / 圆角 / 内边距 现在共用同一套值（都取原「后端账号管理」的蓝色系） */
.mini-badge{
  align-self:flex-start; font-size:9.5px; font-weight:900; padding:4px 9px; border-radius:999px;
  background:rgba(27,132,240,.12); color:var(--blue-d);
}
.mini-badge.back{ background:rgba(27,132,240,.12); color:var(--blue-d); }

/* 项目C：微博 / 小红书 —— 还原真实社交 App 的「个人主页」排版
   【本轮要求8】结构与真实 App 一致：顶部背景图 → 头像（上传占位）→ 用户名；
   UI 内部只保留「名字」和「头像上传点」，关注/粉丝/简介等复杂信息一律不放，保持干净；
   「5.8万+ 阅读」「3000+ 阅读」等数据统一放到 UI 图的下方 */
.social-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; height:100%; align-items:stretch; }
.social-card{
  border-radius:var(--r-lg); padding:18px 18px 16px; position:relative; overflow:hidden;
  background:#fff; border:1px solid var(--line); box-shadow:var(--sh);
  display:flex; flex-direction:column; gap:14px; min-width:0;
  transition:.34s cubic-bezier(.22,.8,.3,1);
}
.social-card:hover{ transform:translateY(-5px); box-shadow:var(--sh-h); }

/* ---- 手机屏幕（主页 UI） ---- */
.sph{
  /* 【新阶段要求5】把「背景图高度」「头像直径」抽成变量，
     头像的上移量与两者的关系就是一条公式，改任一个都不会错位 */
  --sph-cover-h:100px;
  --sph-av:60px;   /* 【新阶段要求2】头像缩小到 60px，与昵称长条等宽 */
  flex:1; min-height:0; display:flex; flex-direction:column; position:relative;
  border:1px solid var(--line); border-radius:16px; overflow:hidden;
  background:linear-gradient(170deg,#FBFDFF,#F1F8FF);
}
/* 顶部背景图 —— 【本轮要求7】不再要用户上传，直接用代码画平台调性的背景
   · 微博：明黄→橙色渐变 + 资讯流横条线条
   · 小红书：白→粉红渐变 + 细线网格与卡片轮廓（精致排版感）
   实现为一张铺满封面的内联 SVG（.sph-art），随卡片宽度自适应裁切 */
.sph-cover{
  position:relative; height:var(--sph-cover-h); flex:0 0 auto;
  overflow:hidden; background:#EAF4FF;
}
.sph-art{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.wb .sph-cover{ background:#FF9E2C; }
.xhs .sph-cover{ background:#FFE3EC; }

/* 平台官方图标（左上角，模拟 App 标题栏） */
.sph-brand{
  position:absolute; top:8px; left:8px; z-index:2;
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 3px;
  border-radius:999px; background:rgba(255,255,255,.94);
  box-shadow:0 2px 8px rgba(23,116,196,.16);
}
.sph-brand .sph-ico{ width:18px;height:18px; border-radius:6px; overflow:hidden; flex:0 0 auto; }
.sph-brand .sph-ico svg{ width:100%; height:100%; display:block; }
.sph-brand b{ font-size:9.5px; font-weight:900; }
.wb .sph-brand b{ color:#E8590C; }
.xhs .sph-brand b{ color:#FF2442; }

/* 头像（上传占位）+ 昵称（填写占位）
   【新阶段要求5】头像圆圈上移半个自身高度 → 圆心正好落在背景图最底边：
     头像 top = 背景图高(100) - 头像高/2(31) = 69 → 上半 31px 压在背景图上，下半 31px 露在下方
   实现要点：① 用负 margin 上移，头像留在文档流内 → 位置由公式决定，不会随容器高度漂移
            ② 保留 position:relative + z-index → 仍压在背景图之上（绝对定位去掉后会被封面盖住）
            ③ .sph-body 改为 flex-start：头像顶边成为行内第一个元素，下方余量自然落在昵称之后 */
.sph-body{
  flex:1; min-height:0; padding:0 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:7px;
}
/* 【需求3】头像占位框也统一到「CET-4 学习证明」那套基准：
   虚线框 / 底色 / 图标与文字颜色 全部改用上面的 --ph-* 变量，
   只有「形状」不同（头像必须是正圆，所以保留 border-radius:50%），
   另外 60px 的圆放不下 22px 图标 + 6px 间距，图标与文字按比例缩到 16px / 8.5px。
   ★ 原来 .wb / .xhs 各自的橙色 / 粉色描边已删除，微博与小红书两个头像框现在完全一样。 */
.sph-av{
  position:relative; z-index:2; margin-top:calc(var(--sph-av) / -2);
  flex:0 0 auto;   /* 尺寸锁死：窗口再窄也不被压扁，保证「一半压图 / 一半露下」的比例恒定 */
  width:var(--sph-av); height:var(--sph-av); border-radius:50%;
  display:grid; place-items:center; place-content:center; gap:3px;
  color:var(--ph-ink); border:var(--ph-dash); background:var(--ph-bg);
  box-shadow:0 4px 12px rgba(23,116,196,.16);
}
.sph-av svg{ width:16px;height:16px; opacity:.7; }
.sph-av i{ font-style:normal; font-size:8.5px; font-weight:800; letter-spacing:.3px; white-space:nowrap; }
/* 【需求5】微博头像圆圈 → 微博橙 #FF8200；小红书头像圆圈 → 小红书粉 #FF2E4D
   （虚线描边 / 图标 / 文字 / 投影 一起换成品牌色；底色保留极淡的品牌色渐变，避免色块过重）
   写在 .sph-av 基准之后 → 优先级更高；其它头像框（生涯规划等）仍用统一基准蓝色。
   ★ 想换色只改这一处即可，改完微博 / 小红书两个圆圈立刻跟着变 */
.wb .sph-av{
  color:#FF8200;
  border-color:rgba(255,130,0,.5);
  background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,242,230,.94));
  box-shadow:0 4px 12px rgba(255,130,0,.22);
}
.xhs .sph-av{
  color:#FF2E4D;
  border-color:rgba(255,46,77,.42);
  background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,235,240,.94));
  box-shadow:0 4px 12px rgba(255,46,77,.2);
}

/* 昵称填写占位符：空态用虚线胶囊，填入后自动变成正常昵称样式
   【新阶段要求2】长条宽度锁定 60px = 头像直径（border-box + 内容居中）：
   · 内宽 60 - 2×1.5边框 - 2×5内边距 = 47px > 文字 44.8px，「填写昵称」放得下且不折行
   · 头像缩小(62→60) + 间距微收(8→7) → 昵称整体上移，底部呼吸空间 7.5px → 9.5px */
.sph-nick{
  display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  width:60px; box-sizing:border-box;
  font-size:11px; font-weight:800; letter-spacing:.2px;
  color:var(--ink-3); border:1.5px dashed rgba(27,132,240,.45); border-radius:999px;
  padding:4px 5px; background:rgba(255,255,255,.72); max-width:100%;
}
/* 【需求4】微博昵称 → 微博橙 #FF8200；小红书昵称 → 小红书粉 #FF2E4D
   ★ 两行 .filled 版本是必须的：真昵称（「李谱的微博」/「长腿的充电宝」）会被 JS 加上 .filled 类，
     而 .sph-nick.filled 的 color:var(--ink) 会盖掉上面的品牌色 → 这里用更高优先级把它接回来，
     所以「填入真实昵称后颜色依然是品牌色」，编辑模式下改文字也不会掉色。 */
.wb .sph-nick{ border-color:rgba(255,130,0,.5); color:#FF8200; }
.xhs .sph-nick{ border-color:rgba(255,46,77,.42); color:#FF2E4D; }
.wb .sph-nick.filled{ color:#FF8200; }
.xhs .sph-nick.filled{ color:#FF2E4D; }
.sph-nick.filled{
  width:auto;   /* 真实昵称不受 60px 占位宽度限制 */
  border:1.5px solid transparent; background:transparent; padding:2px 0;
  font-size:13px; font-weight:900; color:var(--ink); letter-spacing:.2px;
}

/* ---- UI 图下方的阅读数据 ---- */
.social-stat{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
.social-num{
  font-size:30px; font-weight:900; letter-spacing:-1px; line-height:1.05; font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,var(--orange),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;
}
/* 【本轮要求2】微博卡片的阅读数据：文字颜色改为与微博 UI 图背景的橘色渐变完全一致
   （对应 artWb 里 linearGradient #FFD24D → #FFA22C(55%) → #FF7A2F，135° 对角方向） */
.wb .social-num{
  background:linear-gradient(135deg,#FFD24D 0%,#FFA22C 55%,#FF7A2F 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.xhs .social-num{ background:linear-gradient(120deg,#FF5B5B,var(--pink)); -webkit-background-clip:text; background-clip:text; }
.social-sub{ font-size:11px; font-weight:800; color:var(--ink-3); display:inline-flex; align-items:center; gap:4px; }
.social-sub svg{ width:12px;height:12px; }
.social-sub b{ color:var(--ink); font-weight:900; font-variant-numeric:tabular-nums; }

/* 通用：项目技术栈行（g3 = 两行三列，标签紧凑、文字不换行） */
.tech-row{ display:flex; flex-wrap:wrap; gap:8px; }
.tech-row.g3{
  display:grid; grid-template-columns:repeat(3,max-content);
  gap:20px 12px;                  /* 【本轮要求2】行距 14 → 20：上下两行标签之间拉开，不再挤在一起 */
  justify-content:start;          /* 标签各自收窄 → 右侧腾出呼吸空间 */
  align-content:center;
}
.tech-row.g3 .tech{ justify-content:center; text-align:center; }
.tech{
  font-size:10.5px; font-weight:800; line-height:1.2; padding:6px 11px; border-radius:999px;
  background:rgba(27,132,240,.08); color:var(--blue-d); border:1px solid rgba(27,132,240,.16);
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.tech svg{ width:11px;height:11px; flex:0 0 auto; }

/* ============================================================
   7. 技能图谱
   ============================================================ */
/* 平铺卡片：左大图标 / 右标题 + 技能标签，全部直接展示，不折叠
   4 张卡尺寸绝对相等：2×2 网格 + 行高 1fr；横竖间距同为一个 s（--skill-gap） */
.skill-grid{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:1fr; gap:var(--skill-gap); align-items:stretch;
}
.skill-card{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-xl);
  padding:28px 30px; box-shadow:var(--sh); position:relative; overflow:hidden;
  transition:.34s cubic-bezier(.22,.8,.3,1);
}
.skill-card:hover{ box-shadow:var(--sh-h); transform:translateY(-4px); }
.skill-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,var(--sky),var(--blue));
}
.skill-card[data-accent="yellow"]::before{ background:linear-gradient(90deg,var(--yellow),var(--orange)); }
.skill-card[data-accent="pink"]::before{ background:linear-gradient(90deg,var(--pink),var(--violet)); }
.skill-card[data-accent="lime"]::before{ background:linear-gradient(90deg,var(--lime),#3FBBA0); }
/* 【本轮要求3】图标 ↔ 右侧文字区块（标题+标签）的水平间距 22px → 34px */
.skill-main{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:34px; align-items:center; }
.skill-ico{
  width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:linear-gradient(135deg,var(--sky),var(--blue));
  box-shadow:0 10px 24px rgba(27,132,240,.28);
  transition:.4s cubic-bezier(.22,.8,.3,1);
}
.skill-card[data-accent="yellow"] .skill-ico{ background:linear-gradient(135deg,var(--yellow),var(--orange)); box-shadow:0 10px 24px rgba(255,154,61,.3); }
.skill-card[data-accent="pink"] .skill-ico{ background:linear-gradient(135deg,var(--pink),var(--violet)); box-shadow:0 10px 24px rgba(255,124,182,.32); }
.skill-card[data-accent="lime"] .skill-ico{ background:linear-gradient(135deg,var(--lime),#3FBBA0); box-shadow:0 10px 24px rgba(127,216,106,.32); }
.skill-ico svg{ width:31px;height:31px; }
.skill-card:hover .skill-ico{ transform:rotate(-6deg) scale(1.06); }
.skill-txt{ display:flex; flex-direction:column; gap:15px; min-width:0; }
.skill-txt b{ font-size:19px; font-weight:900; letter-spacing:-.2px; line-height:1.2; }
.skill-items{ display:flex; flex-wrap:wrap; gap:8px; }
/* 【新阶段要求3】技能标签显式两行（「AI应用」模块）：
   每个行容器一个 flex 行 → 严格锁定「第一行 3 个、第二行 2 个」，不受自动换行影响；
   · flex:1 1 0 让行内标签等分该行的剩余空间 → 两行都正好撑满文本块宽度，左右边缘对齐、无空洞
   · min-width:max-content 兜底 → 标签永远不会被压窄到文字折行（「DeepSeek API接入」较长）
   · 行距与行内间距统一 8px；font/圆角/边框/配色沿用 .skill-item，一点没动
   · flex-wrap 保留：极端窄屏下宁可折行也不溢出 */
.skill-rows{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.skill-rows .skill-items{ justify-content:space-between; }
/* 【新阶段需求2】左对齐行（项目管理/数据分析第二行单标签）：
   改用 3 列网格 → 单标签自动继承「第一行首标签」的列宽并贴左缘对齐。
   第一列列宽 = (文本块宽 − 2×8px 列间距)/3，与第一行首标签 flex:1 1 0 的三等分结果完全一致；
   单标签放在第 1 列并拉伸到该列宽 → 宽度、左边缘都与第一行首标签逐像素对齐 */
.skill-rows .skill-items.start{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  justify-content:initial;
}
.skill-rows .skill-items.start .skill-item{
  grid-column:1; width:auto; flex:none; min-width:0; max-width:none;
}
.skill-rows .skill-item{
  flex:1 1 0; min-width:max-content; justify-content:center;
  /* 单个标签最宽不超过「一行放两个」的宽度：桌面端恰好等于两等分的宽度（无影响），
     只在窗口收窄、某一行被迫折行时兜住，避免一个标签独占整行 */
  max-width:calc(50% - 4px);
}
.skill-item{
  font:inherit; font-size:11.5px; font-weight:800; padding:8px 13px; border-radius:11px; cursor:pointer;
  background:rgba(27,132,240,.07); color:var(--blue-d); border:1px solid rgba(27,132,240,.16);
  transition:.28s cubic-bezier(.22,.8,.3,1);
  display:inline-flex; align-items:center; gap:6px;
}
.skill-item::after{ content:'›'; color:var(--ink-3); font-weight:900; }
.skill-item:hover{
  background:linear-gradient(135deg,var(--sky),var(--blue)); color:#fff;
  border-color:transparent; transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(27,132,240,.3);
}
.skill-item:hover::after{ color:#fff; }
/* 【本轮要求5】暂无跳转的技能标签（Excel·PPT·Word / 报告撰写）：
   保留同样的小胶囊外观，但去掉表示可点击的「›」箭头与悬浮上浮/变色，避免点了没反应 */
.skill-item.no-link{ cursor:default; }
.skill-item.no-link::after{ content:none; }
.skill-item.no-link:hover{
  background:rgba(27,132,240,.07); color:var(--blue-d);
  border-color:rgba(27,132,240,.16); transform:none; box-shadow:none;
}

/* 高亮闪烁 */
.card.flash,.proj-card.flash{ animation:flash 1.5s ease-out 2; }
@keyframes flash{
  0%{ box-shadow:0 0 0 0 rgba(255,210,77,.9); transform:translateY(-4px) scale(1.012);}
  60%{ box-shadow:0 0 0 12px rgba(255,210,77,0);}
  100%{ box-shadow:var(--sh); transform:none;}
}

/* ============================================================
   8. 联系我
   ============================================================ */
.motto{
  border-radius:var(--r-xl); padding:58px 40px; text-align:center; position:relative; overflow:hidden;
  background:linear-gradient(140deg,#DDF2FF,#EAF7FF 40%,#FFF3DC);
  border:1px solid var(--line); box-shadow:var(--sh);
}
.motto::after{
  content:''; position:absolute; inset:-50%;
  background:conic-gradient(from 0deg,rgba(76,194,247,.22),rgba(255,210,77,.22),rgba(255,124,182,.22),rgba(76,194,247,.22));
  animation:spin 22s linear infinite; filter:blur(46px);
}
.motto p{
  position:relative; z-index:1; margin:0;
  font-size:clamp(22px,3.4vw,36px); font-weight:900; letter-spacing:-.6px; line-height:1.42;
  background:linear-gradient(120deg,var(--blue-d),var(--sky) 46%,var(--orange));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
/* 联系我：留白靠「标题行统一间距 + 座右铭自身内边距 + 联系方式上边距」拉开，
